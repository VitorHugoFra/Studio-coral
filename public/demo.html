<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cardápio · Pedido online</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Solway:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/coral.css">
  <script src="/t.js"></script>
  <script defer src="/vendor/alpine.js"></script>
  <style>
    /* Layout de cardápio digital: coluna central, carrossel, seções com foto,
       abas fixas por categoria e itens com foto à direita. */
    :root { --c: #73350c; --txt: #2b2b2b; --sub: #6f6f6f; --bg: #f2f2f2; --fs: 1; }
    body { background: var(--bg); font-family: 'Open Sans', system-ui, sans-serif; color: var(--txt); font-size: calc(15px * var(--fs)); }
    .app { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; position: relative; box-shadow: 0 0 0 1px #e6e6e6; }
    .demo-bar { background: #1d1710; color: #d9cbb8; font-size: 12px; padding: 6px 14px; text-align: center; font-family: var(--font); }

    .top { height: 56px; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 0 4px; position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid #eee; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--c); cursor: pointer; border-radius: 50%; }
    .icon-btn:hover { background: #f5f5f5; }
    .brandmark { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font); font-weight: 700; font-size: 15px; color: var(--txt); letter-spacing: .02em; }
    .brandmark .m { width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; }
    .search { padding: 8px 12px; border-bottom: 1px solid #eee; position: sticky; top: 56px; z-index: 29; background: #fff; }
    .search input { width: 100%; border: 1px solid #ddd; border-radius: 22px; padding: 9px 16px; font: inherit; }
    .search input:focus { outline: none; border-color: var(--c); }

    .carousel { position: relative; aspect-ratio: 1200 / 520; background: #222; overflow: hidden; }
    .slides { display: flex; height: 100%; transition: transform .5s ease; }
    .slides img { width: 100%; height: 100%; object-fit: cover; flex: none; }
    .car-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; cursor: pointer; display: grid; place-items: center; }
    .car-arrow.l { left: 10px; } .car-arrow.r { right: 10px; }
    .dots { display: flex; gap: 6px; padding: 8px 12px 0; }
    .dots button { width: 7px; height: 7px; border-radius: 50%; border: 0; background: #d5d5d5; padding: 0; cursor: pointer; }
    .dots button.on { background: var(--c); }

    .title-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 10px; gap: 8px; }
    .title-row h1 { font-size: calc(15px * var(--fs)); font-weight: 600; font-family: 'Open Sans', sans-serif; color: var(--txt); letter-spacing: 0; }
    .title-row .tools { display: flex; gap: 2px; }
    .title-row .tools button { border: 0; background: none; cursor: pointer; font-weight: 700; color: var(--txt); width: 34px; height: 34px; border-radius: 50%; font-size: 13px; }
    .title-row .tools button:hover { background: #f3f3f3; }

    .hello { margin: 0 12px 10px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--c) 9%, #fff); font-size: calc(13.5px * var(--fs)); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .hello b.cp { border: 1.5px dashed var(--c); color: var(--c); padding: 2px 8px; border-radius: 4px; letter-spacing: .05em; white-space: nowrap; }

    .sections { display: flex; gap: 8px; overflow-x: auto; padding: 2px 12px 12px; scrollbar-width: none; }
    .sections::-webkit-scrollbar { display: none; }
    .sec { flex: none; width: 168px; height: 56px; border-radius: 8px; position: relative; overflow: hidden; border: 0; cursor: pointer; color: #fff; font: inherit; font-weight: 600; text-align: left; padding: 0 14px; display: flex; align-items: center; background: #444 center / 140%; }
    .sec::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
    .sec span { position: relative; }
    .sec.main { background: var(--c); }
    .sec.main::before { display: none; }

    .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid #e8e8e8; position: sticky; top: 56px; z-index: 20; background: #fff; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; border: 0; background: none; padding: 13px 18px; font: inherit; font-size: calc(13.5px * var(--fs)); color: #444; cursor: pointer; border-bottom: 2px solid transparent; border-right: 1px solid #f0f0f0; }
    .tabs button.on { color: var(--txt); border-bottom-color: var(--c); font-weight: 600; }

    .cat-title { background: #f6f6f6; padding: 9px 12px; font-size: calc(16px * var(--fs)); font-weight: 600; margin: 0; scroll-margin-top: 108px; }
    .item { display: grid; grid-template-columns: 1fr 112px; gap: 14px; padding: 16px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .item:hover { background: #fcfcfc; }
    .item h3 { font-family: 'Open Sans', sans-serif; font-size: calc(15.5px * var(--fs)); font-weight: 700; color: var(--txt); letter-spacing: 0; line-height: 1.3; }
    .item p { margin: 6px 0 10px; color: var(--sub); font-size: calc(13.5px * var(--fs)); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .price { font-weight: 600; font-size: calc(14px * var(--fs)); }
    .item .more { color: var(--c); font-weight: 600; font-size: calc(13.5px * var(--fs)); display: block; margin-top: 2px; }
    .item .ph { width: 112px; height: 112px; border-radius: 8px; object-fit: cover; background: #eee; }
    .item .tag { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); margin-bottom: 4px; }
    .item .inbag { color: var(--c); font-size: 12px; font-weight: 700; margin-left: 8px; }
    .empty-search { padding: 40px 16px; text-align: center; color: var(--sub); }

    .made { text-align: center; padding: 28px 16px 110px; color: #999; font-size: 12px; display: grid; justify-items: center; gap: 6px; font-family: var(--font); }
    .made .logo { width: 64px; --logo-color: #9b8b7a; }

    .bag-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(576px, calc(100% - 24px)); z-index: 40; border: 0; border-radius: 10px; background: var(--c); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

    .shade { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; }
    .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(600px, 100%); max-height: 92vh; overflow: auto; background: #fff; z-index: 70; border-radius: 14px 14px 0 0; }
    .sheet .hero { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #eee; }
    .sheet .close { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); cursor: pointer; font-size: 20px; line-height: 1; }
    .sheet .content { padding: 16px 16px 20px; display: grid; gap: 12px; }
    .sheet h2 { font-family: 'Open Sans', sans-serif; font-size: 20px; letter-spacing: 0; }
    .sheet p { margin: 0; color: var(--sub); line-height: 1.5; }
    .sheet textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font: inherit; min-height: 64px; resize: vertical; }
    .stepper { display: inline-flex; align-items: center; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
    .stepper button { width: 40px; height: 42px; border: 0; background: #fff; font-size: 20px; color: var(--c); cursor: pointer; }
    .stepper b { min-width: 32px; text-align: center; }
    .add-btn { flex: 1; border: 0; border-radius: 8px; background: var(--c); color: #fff; font: inherit; font-weight: 700; padding: 0 16px; min-height: 44px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; align-items: center; }
    .qty { display: inline-flex; align-items: center; gap: 10px; }
    .qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; background: #fff; cursor: pointer; font-weight: 700; color: var(--c); }
    .field label { font-family: 'Open Sans', sans-serif; }
    .field label .opt { font-weight: 400; color: var(--sub); text-transform: none; letter-spacing: 0; }
    .form-title { font-family: 'Open Sans', sans-serif; font-size: 16px; letter-spacing: 0; margin-top: 4px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: #fff; font: inherit; padding: 10px; cursor: pointer; color: var(--txt); }
    .seg button + button { border-left: 1px solid #ddd; }
    .seg button.on { background: var(--c); color: #fff; font-weight: 600; }
    .grid-cep { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: end; }
    .cep-hint { margin: 0 0 10px; }
    .grid-street { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
    .grid-city { display: grid; grid-template-columns: 1fr 1fr 64px; gap: 10px; }
    .grid-bday { display: grid; grid-template-columns: 84px 1fr; gap: 8px; }
    .optin { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; cursor: pointer; }
    .optin input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--c); flex: none; }
    .track { margin: 0 12px 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--c) 30%, #fff); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; }
    .track a { color: var(--c); font-weight: 700; white-space: nowrap; }
    @media (max-width: 420px) {
      .grid-city { grid-template-columns: 1fr 64px; }
      .grid-city .field:first-child { grid-column: 1 / -1; }
      .grid-cep { grid-template-columns: 1fr; }
      .cep-hint { margin: 0; }
    }

    .drawer { position: fixed; top: 0; bottom: 0; left: max(0px, calc(50% - 300px)); width: min(320px, 85vw); background: #fff; z-index: 70; padding: 22px 20px; display: grid; gap: 16px; align-content: start; overflow: auto; }
    .drawer dl { margin: 0; display: grid; gap: 12px; font-size: 14px; }
    .drawer dt { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--sub); font-weight: 700; }
    .drawer dd { margin: 2px 0 0; }
  </style>
</head>
<body x-data="shop" x-cloak :style="`--c:${r?.color || '#73350c'};--fs:${fontScale}`">
  <div class="app">
    <div class="demo-bar">Site de demonstração da Studio Coral. Os pedidos são fictícios e aparecem no painel.</div>

    <template x-if="r">
      <div>
        <header class="top">
          <button class="icon-btn" @click="drawer = true" aria-label="Informações do restaurante"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="brandmark"><span class="m" x-text="initials"></span><span x-text="r.name"></span></div>
          <button class="icon-btn" @click="searching = !searching; if (searching) $nextTick(() => $refs.q.focus()); else q = ''" aria-label="Buscar no cardápio"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        </header>
        <div class="search" x-show="searching"><input x-ref="q" x-model="q" type="search" placeholder="Buscar prato ou bebida"></div>

        <template x-if="!q">
          <div>
            <div class="carousel" x-show="r.banners.length">
              <div class="slides" :style="`transform:translateX(-${slide * 100}%)`">
                <template x-for="b in r.banners" :key="b"><img :src="b" alt=""></template>
              </div>
              <template x-if="r.banners.length > 1">
                <div>
                  <button class="car-arrow l" @click="go(-1)" aria-label="Anterior">‹</button>
                  <button class="car-arrow r" @click="go(1)" aria-label="Próxima">›</button>
                </div>
              </template>
            </div>
            <div class="dots" x-show="r.banners.length > 1"><template x-for="(b, i) in r.banners" :key="i"><button :class="{ on: i === slide }" @click="slide = i" :aria-label="`Foto ${i + 1}`"></button></template></div>

            <div class="title-row">
              <h1 x-text="r.name"></h1>
              <div class="tools">
                <button @click="fontScale = fontScale > 1 ? 1 : 1.15" title="Tamanho da letra" aria-label="Aumentar letra">Aa</button>
                <button @click="share" title="Compartilhar" aria-label="Compartilhar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
              </div>
            </div>

            <div class="track" x-show="lastOrder"><span x-text="lastOrder ? `Seu pedido #${lastOrder.number} ${lastOrder.label}.` : ''"></span><a :href="lastOrder ? `/pedido/${lastOrder.code}` : '#'">Acompanhar</a></div>

            <div class="hello" x-show="ref || coupon">
              <span x-text="ref?.firstName ? `Olá, ${ref.firstName}! Seu cupom já entra no pedido.` : 'Pedindo pelo site você usa o cupom da casa.'"></span>
              <b class="cp" x-show="coupon" x-text="coupon"></b>
            </div>

            <div class="sections">
              <button class="sec main" @click="scrollToCat(categories[0])"><span>Cardápio</span></button>
              <template x-for="c in categories" :key="c">
                <button class="sec" :style="coverOf(c) ? `background-image:url('${coverOf(c)}')` : ''" @click="scrollToCat(c)"><span x-text="c"></span></button>
              </template>
            </div>
          </div>
        </template>

        <nav class="tabs" x-show="!q" x-ref="tabs">
          <template x-for="c in categories" :key="c"><button :class="{ on: active === c }" :data-cat="c" @click="scrollToCat(c)" x-text="c"></button></template>
        </nav>

        <main>
          <template x-for="c in visibleCategories" :key="c">
            <section>
              <h2 class="cat-title" :id="catId(c)" x-text="c"></h2>
              <template x-for="m in itemsOf(c)" :key="m.id">
                <article class="item" @click="openItem(m)">
                  <div>
                    <span class="tag" x-show="m.highlight">Mais pedido</span>
                    <h3><span x-text="m.name"></span><span class="inbag" x-show="qtyOf(m)" x-text="`${qtyOf(m)} na sacola`"></span></h3>
                    <p x-text="m.description"></p>
                    <div class="price" x-text="money(m.price)"></div>
                    <span class="more">Saiba mais</span>
                  </div>
                  <template x-if="m.image"><img class="ph" :src="m.image" :alt="m.name" loading="lazy"></template>
                  <template x-if="!m.image"><span class="ph"></span></template>
                </article>
              </template>
            </section>
          </template>
          <template x-if="q && !visibleCategories.length"><p class="empty-search" x-text="`Nada encontrado para “${q}”.`"></p></template>
        </main>

        <footer class="made"><span class="script" style="font-size:17px;color:#9b8b7a">site feito pela</span><span class="logo"></span></footer>

        <button class="bag-bar" x-show="count && !open && !item && !placed" @click="open = true"><span x-text="`Ver sacola (${count})`"></span><span x-text="money(total)"></span></button>
      </div>
    </template>

    <template x-if="notFound"><div class="empty" style="min-height:70vh">Restaurante não encontrado.</div></template>
  </div>

  <!-- Detalhe do item -->
  <template x-if="item">
    <div>
      <div class="shade" @click="item = null"></div>
      <div class="sheet" role="dialog" aria-modal="true">
        <button class="close" @click="item = null" aria-label="Fechar">×</button>
        <template x-if="item.image"><img class="hero" :src="item.image" :alt="item.name"></template>
        <div class="content">
          <h2 x-text="item.name"></h2>
          <p x-text="item.description"></p>
          <b x-text="money(item.price)"></b>
          <div class="field"><label>Alguma observação?</label><textarea x-model="note" placeholder="Ex.: sem cebola, ponto da carne…"></textarea></div>
          <div class="row" style="gap:10px">
            <div class="stepper"><button @click="qty = Math.max(1, qty - 1)" aria-label="Menos">−</button><b x-text="qty"></b><button @click="qty++" aria-label="Mais">+</button></div>
            <button class="add-btn" @click="addCurrent"><span>Adicionar</span><span x-text="money(item.price * qty)"></span></button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Sacola -->
  <template x-if="open">
    <div>
      <div class="shade" @click="open = false"></div>
      <div class="sheet">
        <div class="content">
          <template x-if="!placed">
            <form class="stack" @submit.prevent="checkout">
              <div class="row between"><h2>Sua sacola</h2><button type="button" class="btn btn-ghost btn-sm" @click="open = false">Fechar</button></div>
              <div>
                <template x-for="l in cart" :key="l.key">
                  <div class="line">
                    <div><div x-text="l.name"></div><div class="small muted" x-text="money(l.price)"></div><div class="tiny muted" x-show="l.note" x-text="`Obs.: ${l.note}`"></div></div>
                    <div class="qty"><button type="button" @click="dec(l)" aria-label="Menos">−</button><b x-text="l.qty"></b><button type="button" @click="l.qty++" aria-label="Mais">+</button></div>
                  </div>
                </template>
              </div>
              <div class="line" x-show="discount"><span x-text="`Cupom ${coupon} (10%)`"></span><span x-text="'− ' + money(discount)"></span></div>
              <div class="line" style="border:0"><b>Total</b><b style="font-size:20px" x-text="money(total)"></b></div>

              <h3 class="form-title">Seus dados</h3>
              <div class="grid-2">
                <div class="field"><label for="c-name">Nome</label><input id="c-name" class="input" x-model="customer.name" autocomplete="name" required maxlength="120"></div>
                <div class="field"><label for="c-phone">WhatsApp</label><input id="c-phone" class="input" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(31) 99999-9999" x-model="customer.phone" @input="customer.phone = maskPhone(customer.phone)" required></div>
              </div>
              <div class="field">
                <label>Receber</label>
                <div class="seg" role="radiogroup" aria-label="Entrega ou retirada">
                  <button type="button" role="radio" :aria-checked="fulfillment === 'delivery'" :class="{ on: fulfillment === 'delivery' }" @click="fulfillment = 'delivery'">Entrega</button>
                  <button type="button" role="radio" :aria-checked="fulfillment === 'pickup'" :class="{ on: fulfillment === 'pickup' }" @click="fulfillment = 'pickup'">Retirada no balcão</button>
                </div>
              </div>
              <template x-if="fulfillment === 'delivery'">
                <div class="stack" style="gap:10px">
                  <div class="grid-cep">
                    <div class="field"><label for="a-cep">CEP</label><input id="a-cep" class="input" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" x-model="address.cep" @input="onCep" required></div>
                    <p class="tiny muted cep-hint" x-text="cepHint"></p>
                  </div>
                  <div class="grid-street">
                    <div class="field"><label for="a-street">Rua</label><input id="a-street" class="input" autocomplete="address-line1" x-model="address.street" required maxlength="160"></div>
                    <div class="field"><label for="a-number">Número</label><input id="a-number" x-ref="number" class="input" x-model="address.number" required maxlength="20"></div>
                  </div>
                  <div class="field"><label for="a-comp">Complemento <span class="opt">(opcional)</span></label><input id="a-comp" class="input" autocomplete="address-line2" placeholder="Apartamento, bloco, ponto de referência" x-model="address.complement" maxlength="120"></div>
                  <div class="grid-city">
                    <div class="field"><label for="a-nb">Bairro</label><input id="a-nb" class="input" x-model="address.neighborhood" required maxlength="80"></div>
                    <div class="field"><label for="a-city">Cidade</label><input id="a-city" class="input" autocomplete="address-level2" x-model="address.city" required maxlength="80"></div>
                    <div class="field"><label for="a-uf">UF</label><input id="a-uf" class="input" autocomplete="address-level1" x-model="address.state" maxlength="2" @input="address.state = address.state.toUpperCase()"></div>
                  </div>
                </div>
              </template>
              <div class="grid-2">
                <div class="field"><label for="c-cpf">CPF <span class="opt">(opcional, para nota fiscal)</span></label><input id="c-cpf" class="input" inputmode="numeric" placeholder="000.000.000-00" x-model="customer.cpf" @input="customer.cpf = maskCpf(customer.cpf)"></div>
                <div class="field">
                  <label>Aniversário <span class="opt">(opcional)</span></label>
                  <div class="grid-bday">
                    <select class="select" aria-label="Dia do aniversário" x-model="customer.birthDay"><option value="">Dia</option><template x-for="d in 31" :key="d"><option :value="d" x-text="d"></option></template></select>
                    <select class="select" aria-label="Mês do aniversário" x-model="customer.birthMonth"><option value="">Mês</option><template x-for="(m, i) in MONTHS" :key="m"><option :value="i + 1" x-text="m"></option></template></select>
                  </div>
                </div>
              </div>
              <div class="field"><label for="o-notes">Observações do pedido <span class="opt">(opcional)</span></label><textarea id="o-notes" x-model="notes" maxlength="500" placeholder="Ex.: troco para R$ 100, tocar o interfone"></textarea></div>
              <label class="optin"><input type="checkbox" x-model="optIn"><span>Quero receber as promoções deste restaurante pelo WhatsApp. Dá para sair quando quiser, respondendo SAIR.</span></label>
              <p class="note red" style="margin:0" x-show="formError" x-text="formError" role="alert"></p>
              <button class="add-btn" :disabled="sending" style="justify-content:center"><span class="spin" x-show="sending"></span> Fazer pedido</button>
              <p class="tiny muted center" style="margin:0">Demonstração: nenhum pagamento é cobrado.</p>
            </form>
          </template>
          <template x-if="placed">
            <div class="stack center" style="padding:16px 0">
              <h2 x-text="`Pedido #${placed.number} recebido`"></h2>
              <p x-text="`Obrigado, ${customer.name.split(' ')[0]}. Total de ${money(placed.total)}.`"></p>
              <p class="small" x-show="ref">Como você veio pelo WhatsApp, este pedido já aparece no relatório da campanha.</p>
              <a class="add-btn" style="justify-content:center;text-decoration:none;justify-self:stretch" :href="`/pedido/${placed.trackingCode}`">Acompanhar pedido</a>
              <button class="btn" style="justify-self:center" @click="reset">Fazer outro pedido</button>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- Informações -->
  <template x-if="drawer">
    <div>
      <div class="shade" @click="drawer = false"></div>
      <aside class="drawer">
        <div class="brandmark" style="justify-content:flex-start"><span class="m" x-text="initials"></span><span x-text="r.name"></span></div>
        <p class="muted" style="margin:0" x-text="r.tagline"></p>
        <dl>
          <div x-show="r.address"><dt>Endereço</dt><dd x-text="r.address"></dd></div>
          <div x-show="r.hours"><dt>Horário</dt><dd x-text="r.hours"></dd></div>
          <div x-show="r.phone"><dt>Telefone</dt><dd x-text="r.phone"></dd></div>
          <div x-show="r.instagram"><dt>Instagram</dt><dd x-text="r.instagram"></dd></div>
        </dl>
        <button class="btn" @click="drawer = false">Voltar ao cardápio</button>
      </aside>
    </div>
  </template>

<script>
document.addEventListener('alpine:init', () => {
  const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const ACTIVE = { new: 'foi recebido', preparing: 'está em preparo', dispatched: 'saiu para entrega' };
  const randomKey = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join('');
  // O navegador pode bloquear o armazenamento (aba anônima): sem ele, o site só não lembra os dados
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sem armazenamento */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* sem armazenamento */ } },
  };

  Alpine.data('shop', () => ({
    MONTHS,
    r: null, ref: null, notFound: false,
    cart: [], open: false, sending: false, placed: null, formError: '',
    customer: { name: '', phone: '', cpf: '', birthDay: '', birthMonth: '' },
    fulfillment: 'delivery',
    address: { cep: '', street: '', number: '', complement: '', neighborhood: '', city: '', state: '' },
    notes: '', optIn: false, orderKey: '', cepHint: '', lastOrder: null,
    item: null, qty: 1, note: '',
    slide: 0, timer: null, active: '', q: '', searching: false, drawer: false, fontScale: 1,

    async init() {
      const slug = location.pathname.split('/').filter(Boolean).pop();
      const res = await fetch(`/api/public/restaurants/${slug}`);
      if (!res.ok) { this.notFound = true; return; }
      this.r = await res.json();
      document.title = `${this.r.name} · Cardápio e pedidos`;
      this.active = this.categories[0];
      // Dados do último pedido neste aparelho (nome, WhatsApp e endereço; o CPF nunca fica guardado)
      const saved = store.get(`sc_cliente_${slug}`);
      if (saved) {
        Object.assign(this.customer, { name: saved.name || '', phone: saved.phone || '' });
        Object.assign(this.address, saved.address || {});
        if (saved.fulfillment) this.fulfillment = saved.fulfillment;
      }
      const code = window.StudioCoral?.ref();
      if (code) {
        const rr = await fetch(`/api/public/ref/${code}`);
        if (rr.ok) { this.ref = await rr.json(); if (!this.customer.name) this.customer.name = this.ref.firstName || ''; }
      }
      this.checkLastOrder(slug);
      // Mudou a sacola, é outro pedido: a chave contra envio repetido recomeça
      this.$watch('cart', () => { this.orderKey = ''; });
      if (this.r.banners.length > 1) this.timer = setInterval(() => this.go(1), 5000);
      this.$nextTick(() => this.watchSections());
    },

    // Carrossel
    go(d) { const n = this.r.banners.length; this.slide = (this.slide + d + n) % n; },

    // Categorias e busca
    get categories() { return [...new Set((this.r?.menu || []).map((m) => m.category || 'Cardápio'))]; },
    catId(c) { return `cat-${c.normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase()}`; },
    coverOf(c) { return (this.r.menu.find((m) => (m.category || 'Cardápio') === c && m.image) || {}).image; },
    matches(m) {
      if (!this.q) return true;
      const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      return norm(`${m.name} ${m.description}`).includes(norm(this.q));
    },
    itemsOf(c) { return this.r.menu.filter((m) => (m.category || 'Cardápio') === c && this.matches(m)); },
    get visibleCategories() { return this.categories.filter((c) => this.itemsOf(c).length); },
    scrollToCat(c) {
      const el = document.getElementById(this.catId(c));
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 105, behavior: 'smooth' });
      this.active = c;
    },
    watchSections() {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          this.active = e.target.textContent;
          this.$refs.tabs?.querySelector(`[data-cat="${CSS.escape(this.active)}"]`)?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        });
      }, { rootMargin: '-110px 0px -70% 0px' });
      document.querySelectorAll('.cat-title').forEach((el) => obs.observe(el));
    },
    share() {
      const data = { title: this.r.name, url: location.origin + location.pathname };
      if (navigator.share) navigator.share(data).catch(() => {});
      else navigator.clipboard?.writeText(data.url);
    },

    get initials() { return this.r.name.split(/\s+/).filter((w) => w.length > 2).slice(0, 2).map((w) => w[0]).join('').toUpperCase(); },
    get coupon() { return this.ref?.coupon || this.r?.coupon || ''; },

    // Sacola
    openItem(m) { this.item = m; this.qty = 1; this.note = ''; },
    addCurrent() {
      const key = `${this.item.id}|${this.note.trim()}`;
      const l = this.cart.find((x) => x.key === key);
      if (l) l.qty += this.qty;
      else this.cart.push({ key, id: this.item.id, name: this.item.name, price: Number(this.item.price), qty: this.qty, note: this.note.trim() });
      this.item = null;
    },
    qtyOf(m) { return this.cart.filter((x) => x.id === m.id).reduce((s, x) => s + x.qty, 0); },
    get count() { return this.cart.reduce((s, l) => s + l.qty, 0); },
    get subtotal() { return this.cart.reduce((s, l) => s + l.qty * l.price, 0); },
    get discount() { return this.coupon ? Math.round(this.subtotal * 0.1 * 100) / 100 : 0; },
    get total() { return Math.max(0, this.subtotal - this.discount); },
    money: (v) => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
    dec(l) { l.qty--; if (l.qty <= 0) this.cart = this.cart.filter((x) => x !== l); if (!this.cart.length) this.open = false; },
    // Máscaras simples (o servidor normaliza e valida de novo)
    maskPhone(v) {
      const d = String(v || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '').slice(0, 11);
      if (d.length <= 2) return d;
      if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
      const cut = d.length === 11 ? 7 : 6;
      return `(${d.slice(0, 2)}) ${d.slice(2, cut)}-${d.slice(cut)}`;
    },
    maskCpf(v) {
      const d = String(v || '').replace(/\D/g, '').slice(0, 11);
      return d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
    },

    // CEP: o ViaCEP preenche rua, bairro, cidade e UF; se falhar, a pessoa digita
    async onCep() {
      const d = this.address.cep.replace(/\D/g, '').slice(0, 8);
      this.address.cep = d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d;
      if (d.length !== 8) { this.cepHint = ''; return; }
      this.cepHint = 'Buscando o endereço…';
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 5000);
      try {
        const res = await fetch(`https://viacep.com.br/ws/${d}/json/`, { signal: ctrl.signal });
        const data = await res.json();
        if (data.erro) { this.cepHint = 'CEP não encontrado. Confira ou preencha o endereço.'; return; }
        Object.assign(this.address, {
          street: data.logradouro || this.address.street,
          neighborhood: data.bairro || this.address.neighborhood,
          city: data.localidade || this.address.city,
          state: data.uf || this.address.state,
        });
        this.cepHint = '';
        this.$nextTick(() => this.$refs.number?.focus());
      } catch {
        this.cepHint = 'Não deu para buscar o CEP agora. Preencha o endereço.';
      } finally { clearTimeout(t); }
    },

    async checkLastOrder(slug) {
      const last = store.get(`sc_pedido_${slug}`);
      if (!last?.code) return;
      try {
        const res = await fetch(`/api/public/orders/${encodeURIComponent(last.code)}`, { cache: 'no-store' });
        const o = res.ok ? await res.json() : null;
        if (o && ACTIVE[o.status]) this.lastOrder = { code: last.code, number: o.number, label: ACTIVE[o.status] };
        else if (res.status === 404 || o) store.del(`sc_pedido_${slug}`);
      } catch { /* sem conexão: sem o atalho */ }
    },

    async checkout() {
      this.formError = '';
      this.sending = true;
      // A mesma chave em todas as tentativas desta sacola: reenviar não duplica o pedido
      if (!this.orderKey) this.orderKey = randomKey();
      const body = {
        restaurantSlug: this.r.slug,
        ref: window.StudioCoral?.ref() || null,
        orderKey: this.orderKey,
        items: this.cart.map((l) => ({ id: l.id, qty: l.qty, note: l.note })),
        customer: { ...this.customer },
        fulfillment: this.fulfillment,
        address: this.fulfillment === 'delivery' ? { ...this.address } : null,
        notes: this.notes,
        marketingOptIn: this.optIn,
      };
      try {
        const res = await fetch('/api/public/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { this.formError = data.error || 'Não foi possível enviar o pedido. Tente de novo.'; return; }
        this.placed = data;
        store.set(`sc_cliente_${this.r.slug}`, { name: this.customer.name, phone: this.customer.phone, address: this.address, fulfillment: this.fulfillment });
        store.set(`sc_pedido_${this.r.slug}`, { code: data.trackingCode, at: Date.now() });
        this.lastOrder = { code: data.trackingCode, number: data.number, label: ACTIVE.new };
      } catch {
        this.formError = 'Sem conexão. Confira a internet e tente de novo.';
      } finally { this.sending = false; }
    },
    reset() { this.cart = []; this.placed = null; this.open = false; this.orderKey = ''; this.notes = ''; this.optIn = false; },
  }));
});
</script>
</body>
</html>
