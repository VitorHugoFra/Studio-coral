<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Coral · Painel</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/coral.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/icons.js"></script>
  <script defer src="/assets/js/app.js"></script>
  <script defer src="/vendor/alpine.js"></script>
</head>
<body x-data="coral" x-cloak>

<!-- ═════════════ LOGIN ═════════════ -->
<template x-if="booted && !user">
  <div class="login-wrap">
    <div class="login-art">
      <span class="brand-lockup"><span class="studio">STUDIO</span><span class="logo"></span></span>
    </div>
    <div class="login-form">
      <template x-if="!forgot">
        <form @submit.prevent="doLogin">
          <h1>Entrar</h1>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" class="input" type="email" autocomplete="username" required x-model="login.email">
          </div>
          <div class="field">
            <label for="pass">Senha</label>
            <input id="pass" class="input" type="password" autocomplete="current-password" required x-model="login.password">
          </div>
          <p class="note red" x-show="login.error" x-text="login.error" style="margin:0"></p>
          <button class="btn btn-dark btn-lg" :disabled="login.loading">
            <span class="spin" x-show="login.loading"></span> Entrar
          </button>
          <div class="row" style="justify-content:space-between">
            <a href="#" class="small" @click.prevent="startForgot()">Esqueci minha senha</a>
            <a href="/" class="small">Voltar para o site</a>
          </div>
        </form>
      </template>
      <template x-if="forgot">
        <form @submit.prevent="sendForgot">
          <h1>Nova senha</h1>
          <template x-if="!forgot.delivery">
            <div style="display:grid;gap:16px">
              <p class="small muted" style="margin:0">Informe o e-mail do seu acesso. Você vai receber um link para criar uma senha nova.</p>
              <div class="field">
                <label for="forgot-email">E-mail</label>
                <input id="forgot-email" class="input" type="email" autocomplete="username" required x-model="forgot.email">
              </div>
              <p class="note red" x-show="forgot.error" x-text="forgot.error" style="margin:0"></p>
              <button class="btn btn-dark btn-lg" :disabled="forgot.loading"><span class="spin" x-show="forgot.loading"></span> Pedir nova senha</button>
            </div>
          </template>
          <template x-if="forgot.delivery === 'email'">
            <p class="note green" style="margin:0">Se este e-mail tiver acesso ao painel, mandamos para ele um link para criar uma senha nova. O link vale por 2 horas. Não chegou? Fale com o gerente do restaurante ou com a Studio Coral.</p>
          </template>
          <template x-if="forgot.delivery === 'manual'">
            <p class="note green" style="margin:0">Pedido registrado. Se este e-mail tiver acesso ao painel, quem cuida dos acessos (o gerente do restaurante ou a Studio Coral) vai mandar para você um link para criar uma senha nova.</p>
          </template>
          <a href="#" class="small" @click.prevent="forgot = null">Voltar para a entrada</a>
        </form>
      </template>
    </div>
  </div>
</template>

<!-- ═════════════ APLICAÇÃO ═════════════ -->
<template x-if="user">
<div class="shell">
  <aside class="sidebar" :class="{ open: navOpen }">
    <a href="#/painel" class="brand-lockup" aria-label="Studio Coral"><span class="studio">STUDIO</span><span class="logo"></span></a>
    <nav class="nav">
      <a href="#/painel" :class="{ active: route.name === 'painel' }" @click="navOpen=false"><span x-html="icon('home')"></span> Painel</a>
      <a href="#/pedidos" :class="{ active: route.name === 'pedidos' }" @click="navOpen=false"><span x-html="icon('bag')"></span> Pedidos <span class="count" x-show="newOrders" x-text="newOrders" :aria-label="`${newOrders} pedidos novos`"></span></a>
      <a href="#/campanhas" :class="{ active: route.name === 'campanhas' }" @click="navOpen=false"><span x-html="icon('send')"></span> Campanhas <span class="count" x-show="isRestaurant && pendingApprovals.length" x-text="pendingApprovals.length"></span></a>
      <a href="#/indicacoes" :class="{ active: route.name === 'indicacoes' }" @click="navOpen=false"><span x-html="icon('link')"></span> Indicações</a>
      <a href="#/relatorios" :class="{ active: route.name === 'relatorios' }" @click="navOpen=false"><span x-html="icon('calendar')"></span> Relatórios</a>
      <template x-if="isManager">
        <a href="#/acessos" :class="{ active: route.name === 'acessos' }" @click="navOpen=false"><span x-html="icon('users')"></span> Equipe</a>
      </template>
      <template x-if="!isRestaurant">
        <div style="display:contents">
          <a href="#/contatos" :class="{ active: route.name === 'contatos' }" @click="navOpen=false"><span x-html="icon('users')"></span> Contatos</a>
          <a href="#/restaurantes" :class="{ active: route.name === 'restaurantes' }" @click="navOpen=false"><span x-html="icon('store')"></span> Restaurantes <span class="count" x-text="restaurants.length"></span></a>
          <a href="#/acessos" :class="{ active: route.name === 'acessos' }" @click="navOpen=false"><span x-html="icon('shield')"></span> Acessos</a>
          <div class="nav-label">Sistema</div>
          <a href="#/conexao" :class="{ active: route.name === 'conexao' }" @click="navOpen=false"><span x-html="icon('plug')"></span> Conexão</a>
          <a href="#/configuracoes" :class="{ active: route.name === 'configuracoes' }" @click="navOpen=false"><span x-html="icon('settings')"></span> Configurações</a>
        </div>
      </template>
    </nav>
    <div class="side-foot">
      <template x-if="!isRestaurant">
        <a href="#/conexao" class="conn-line" @click="navOpen=false">
          <span class="conn-dot" :class="conn.state"></span>
          <span><span x-text="CONN[conn.state] || conn.state"></span> · <span x-text="{ simulator: 'Simulador', wppconnect: 'WPPConnect', 'whatsapp-cloud': 'API Oficial' }[conn.provider] || ''"></span></span>
        </a>
      </template>
      <template x-if="isRestaurant">
        <div class="conn-line"><span class="mono-mark" style="width:26px;height:26px;font-size:11px;border-radius:4px" :style="`background:${restaurants[0]?.color}`" x-text="initials(user.restaurant)"></span><span x-text="user.restaurant"></span></div>
      </template>
      <div class="user-line"><span x-text="user.name"></span><button x-show="isRestaurant" @click="passwordModal = { current: '', password: '', confirm: '' }">Senha</button><button @click="logout">Sair</button></div>
    </div>
  </aside>
  <div class="overlay" style="z-index:30" x-show="navOpen" @click="navOpen=false"></div>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-icon menu-btn" @click="navOpen=true" aria-label="Abrir menu"><span x-html="icon('menu')"></span></button>
      <div class="title">
        <template x-if="route.name === 'painel'"><div><h1>Visão geral</h1><div class="sub" x-text="`Últimos 14 dias · ${scopeName}`"></div></div></template>
        <template x-if="route.name === 'campanhas' && !route.params.id"><div><h1>Campanhas</h1></div></template>
        <template x-if="route.name === 'campanhas' && editor"><div><a href="#/campanhas" class="back"><span x-html="icon('left',14)"></span> Campanhas</a><h1 x-text="editor.form.name || 'Nova campanha'"></h1></div></template>
        <template x-if="route.name === 'campanhas' && detail"><div><a href="#/campanhas" class="back"><span x-html="icon('left',14)"></span> Campanhas</a><h1 x-text="detail.name"></h1><div class="sub" x-text="detail.restaurant"></div></div></template>
        <template x-if="route.name === 'pedidos'"><div><h1>Pedidos</h1><div class="sub" x-text="`Em tempo real · ${scopeName}`"></div></div></template>
        <template x-if="route.name === 'contatos' && !route.params.id"><div><h1>Contatos</h1><div class="sub">Clientes que autorizaram receber mensagens de cada restaurante</div></div></template>
        <template x-if="route.name === 'contatos' && contactProfile"><div><a href="#/contatos" class="back"><span x-html="icon('left',14)"></span> Contatos</a><h1 x-text="contactProfile.name || fmt.phone(contactProfile.phone)"></h1><div class="sub" x-text="contactProfile.restaurant"></div></div></template>
        <template x-if="route.name === 'restaurantes'"><div><h1>Restaurantes</h1></div></template>
        <template x-if="route.name === 'acessos' && !isRestaurant"><div><h1>Acessos</h1><div class="sub">Quem entra no painel de cada restaurante</div></div></template>
        <template x-if="route.name === 'acessos' && isRestaurant"><div><h1>Equipe</h1><div class="sub" x-text="`Quem do ${user.restaurant} entra no painel`"></div></div></template>
        <template x-if="route.name === 'conexao'"><div><h1>Conexão</h1><div class="sub">Por onde as mensagens são enviadas</div></div></template>
        <template x-if="route.name === 'configuracoes'"><div><h1>Configurações</h1></div></template>
        <template x-if="route.name === 'indicacoes'"><div><h1>Indicações</h1><div class="sub" x-text="`Links dos clientes e cupons de quem indicou · ${scopeName}`"></div></div></template>
        <template x-if="route.name === 'relatorios'"><div><h1>Relatórios mensais</h1><div class="sub">Resultado das campanhas do mês, pronto para enviar ao restaurante em PDF</div></div></template>
      </div>
      <template x-if="!isRestaurant && ['painel','pedidos','indicacoes','campanhas','contatos','acessos'].includes(route.name) && !route.params.id">
        <select class="select" aria-label="Restaurante" :value="scope" @change="setScope($event.target.value)">
          <option value="">Todos os restaurantes</option>
          <template x-for="r in restaurants" :key="r.id"><option :value="r.id" x-text="r.name" :selected="r.id === scope"></option></template>
        </select>
      </template>
      <template x-if="!isRestaurant && route.name === 'campanhas' && !route.params.id">
        <a href="#/campanhas/nova" class="btn btn-primary"><span x-html="icon('plus')"></span> Nova campanha</a>
      </template>
      <template x-if="canManageAccess && route.name === 'acessos'">
        <button class="btn btn-primary" @click="newAccess()"><span x-html="icon('plus')"></span> <span x-text="isRestaurant ? 'Convidar pessoa' : 'Novo acesso'"></span></button>
      </template>
      <template x-if="!isRestaurant && route.name === 'pedidos'">
        <button class="btn" @click="openOrderImport()"><span x-html="icon('upload',16)"></span> Importar planilha</button>
      </template>
    </header>

    <!-- ─────────── PAINEL ─────────── -->
    <template x-if="route.name === 'painel' && dashboard">
      <section>
        <template x-if="isRestaurant && pendingApprovals.length">
          <div class="card card-pad approval-callout">
            <div class="grow">
              <b x-text="pendingApprovals.length === 1 ? 'Uma campanha está esperando sua aprovação' : `${pendingApprovals.length} campanhas estão esperando sua aprovação`"></b>
              <div class="small muted" x-text="pendingApprovals.map(c => c.name).join(', ')"></div>
            </div>
            <a class="btn btn-primary" :href="`#/campanhas/${pendingApprovals[0].id}`">Revisar agora</a>
          </div>
        </template>
        <div class="card stats">
          <div><div class="label-up">Enviadas</div><div class="value" x-text="fmt.int(dashboard.totals.sent)"></div><div class="foot" x-text="`${fmt.pct(dashboard.totals.deliveryRate)} entregues`"></div></div>
          <div><div class="label-up">Lidas</div><div class="value" x-text="fmt.pct(dashboard.totals.readRate)"></div><div class="foot" x-text="`${fmt.int(dashboard.totals.read)} mensagens`"></div></div>
          <div><div class="label-up">Cliques</div><div class="value" x-text="fmt.int(dashboard.totals.clicked)"></div><div class="foot" x-text="`${fmt.pct(dashboard.totals.clickRate)} das entregues`"></div></div>
          <div><div class="label-up">Pedidos</div><div class="value" x-text="fmt.int(dashboard.totals.orders)"></div><div class="foot" x-text="`ticket médio ${fmt.money(dashboard.totals.ticket)}`"></div></div>
          <div class="money"><div class="label-up">Vendas pelo site</div><div class="value" x-text="fmt.money(dashboard.totals.revenue)"></div><div class="foot">pedidos vindos das campanhas</div></div>
        </div>

        <div class="dash-grid">
          <div class="card">
            <div class="card-head">
              <h3>Por dia</h3>
              <div class="legend"><span><i style="background:#092b03"></i>Enviadas</span><span><i style="background:#6f9a5f"></i>Lidas</span><span><i style="background:#d99a00"></i>Cliques</span><span><i style="background:#73350c;height:8px;width:8px"></i>Pedidos</span></div>
            </div>
            <div style="padding:12px 16px 8px;position:relative" @mousemove="chartMove" @mouseleave="chartHover=null">
              <div x-html="trendSvg"></div>
              <template x-if="hoverDay">
                <div class="chart-tip">
                  <b style="grid-column:1/-1;text-align:left" x-text="fmt.date(hoverDay.day + 'T12:00')"></b>
                  <span>Enviadas</span><b x-text="hoverDay.sent"></b>
                  <span>Lidas</span><b x-text="hoverDay.read"></b>
                  <span>Cliques</span><b x-text="hoverDay.clicks"></b>
                  <span>Pedidos</span><b x-text="hoverDay.orders"></b>
                </div>
              </template>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Da mensagem ao pedido</h3></div>
            <div class="card-pad funnel">
              <template x-for="s in funnel(dashboard.totals)" :key="s.label">
                <div class="funnel-row">
                  <span x-text="s.label"></span>
                  <div class="bar" :class="{ low: s.low }"><span :style="`width:${s.width}%;background:${s.color}`"></span><b x-text="fmt.int(s.value)"></b></div>
                  <span class="rate" x-text="s.rate + '%'"></span>
                </div>
              </template>
              <p class="small muted" style="margin:6px 0 0">Percentual em relação à etapa anterior.</p>
            </div>
          </div>
        </div>

        <div class="dash-grid">
          <div class="card">
            <div class="card-head"><h3>Campanhas</h3><a href="#/campanhas" class="small">Ver todas</a></div>
            <div class="table-wrap">
              <table class="table camp-table">
                <thead><tr><th>Campanha</th><th>Situação</th><th class="hide-sm">Entrega</th><th>Cliques</th><th>Pedidos</th><th style="text-align:right">Vendas</th></tr></thead>
                <tbody>
                  <template x-for="c in dashboard.campaigns.slice(0,6)" :key="c.id">
                    <tr @click="go(`#/campanhas/${c.id}`)">
                      <td><b x-text="c.name"></b><div class="tiny muted" x-text="`${c.restaurant} · ${fmt.date(c.startedAt)}`"></div></td>
                      <td><span class="status" :class="campaignClass(c)" x-text="campaignLabel(c)"></span></td>
                      <td class="hide-sm num" x-text="fmt.pct(c.stats.deliveryRate)"></td>
                      <td class="num" x-text="fmt.int(c.stats.clicked)"></td>
                      <td class="num" x-text="fmt.int(c.stats.orders)"></td>
                      <td class="num" style="text-align:right" x-text="fmt.money(c.stats.revenue)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template x-if="!dashboard.campaigns.length"><div class="empty">Nenhuma campanha enviada ainda.</div></template>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Últimos pedidos</h3><span class="small muted" x-text="`${dashboard.contacts.authorized} contatos autorizados`"></span></div>
            <ul class="orders">
              <template x-for="o in dashboard.recentOrders" :key="o.id">
                <li><div><b x-text="o.customerName || 'Cliente'"></b><div class="tiny muted" x-text="`${o.campaign} · ${fmt.rel(o.createdAt)}`"></div></div><span class="val" x-text="fmt.money(o.value)"></span></li>
              </template>
            </ul>
            <template x-if="!dashboard.recentOrders.length"><div class="empty">Os pedidos feitos pelos links das campanhas aparecem aqui.</div></template>
          </div>
        </div>
      </section>
    </template>

    <!-- ─────────── PEDIDOS ─────────── -->
    <template x-if="route.name === 'pedidos'">
      <section class="stack orders-page">
        <div class="board">
          <template x-for="col in boardColumns" :key="col.status">
            <div class="board-col" :class="col.status">
              <div class="board-head"><b x-text="col.label"></b><span class="board-count" x-text="col.orders.length"></span></div>
              <div class="board-list">
                <template x-for="o in col.orders" :key="o.id">
                  <article class="order-card" tabindex="0" @click="openOrder(o)" @keydown.enter="openOrder(o)">
                    <div class="row between"><b class="order-num" x-text="orderLabel(o)"></b><span class="tiny muted" :title="fmt.dateTime(o.createdAt)" x-text="fmt.rel(o.createdAt)"></span></div>
                    <div class="order-name" x-text="o.customerName || 'Cliente'"></div>
                    <div class="tiny muted" x-show="!scope && !isRestaurant" x-text="o.restaurant"></div>
                    <ul class="order-items">
                      <template x-for="(it, i) in o.items.slice(0, 4)" :key="i"><li><span x-text="`${it.qty}× ${it.name}`"></span><span class="tiny muted" x-show="it.note" x-text="` · ${it.note}`"></span></li></template>
                      <li class="muted" x-show="o.items.length > 4" x-text="`+ ${o.items.length - 4} itens`"></li>
                    </ul>
                    <div class="row between" style="gap:8px"><span class="chip" x-text="fulfillmentText(o)"></span><b x-text="fmt.money(o.value)"></b></div>
                    <div class="tiny" style="color:var(--brown)" x-show="o.notes" x-text="`Obs.: ${o.notes}`"></div>
                    <button class="btn btn-sm btn-dark" @click.stop="advance(o)" x-text="nextLabel(o)"></button>
                  </article>
                </template>
                <div class="board-empty" x-show="!col.orders.length" x-text="col.empty"></div>
              </div>
            </div>
          </template>
        </div>

        <div class="card">
          <div class="card-head" style="flex-wrap:wrap;gap:10px">
            <h3>Histórico</h3>
            <div class="row-wrap">
              <input class="input" style="max-width:230px" type="search" placeholder="Nome, telefone ou número" aria-label="Buscar pedido" x-model="orderFilter.search" @input.debounce.300ms="loadOrders()">
              <select class="select" style="width:auto" aria-label="Situação" x-model="orderFilter.status" @change="loadOrders()">
                <option value="">Todas as situações</option>
                <template x-for="(label, key) in ORDER_STATUS" :key="key"><option :value="key" x-text="label"></option></template>
              </select>
              <select class="select" style="width:auto" aria-label="Origem" x-model="orderFilter.source" @change="loadOrders()">
                <option value="">Todas as origens</option>
                <template x-for="(label, key) in ORDER_SOURCE" :key="key"><option :value="key" x-text="label"></option></template>
              </select>
              <input class="input" style="width:auto" type="date" aria-label="De" x-model="orderFilter.from" @change="loadOrders()">
              <input class="input" style="width:auto" type="date" aria-label="Até" x-model="orderFilter.to" @change="loadOrders()">
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Pedido</th><th>Cliente</th><th class="hide-sm">Origem</th><th class="hide-sm">Receber</th><th>Situação</th><th style="text-align:right">Total</th></tr></thead>
              <tbody>
                <template x-for="o in orders" :key="o.id">
                  <tr @click="openOrder(o)" style="cursor:pointer">
                    <td><b x-text="orderLabel(o)"></b><div class="tiny muted" x-text="fmt.dateTime(o.createdAt)"></div></td>
                    <td><span x-text="o.customerName || '—'"></span><div class="tiny muted" x-show="!scope && !isRestaurant" x-text="o.restaurant"></div></td>
                    <td class="hide-sm small"><span x-text="ORDER_SOURCE[o.source] || o.source"></span><span class="muted" x-show="o.channel" x-text="` · ${o.channel}`"></span></td>
                    <td class="hide-sm small" x-text="fulfillmentText(o) || '—'"></td>
                    <td><span class="status" :class="ORDER_CLASS[o.status]" x-text="orderStatusLabel(o)"></span></td>
                    <td class="num" style="text-align:right" x-text="fmt.money(o.value)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!orders.length"><div class="empty">Nenhum pedido neste filtro.</div></template>
            <div class="small muted" style="padding:10px 16px" x-show="orders.length" x-text="`${fmt.int(orders.length)} ${orders.length === 1 ? 'pedido' : 'pedidos'}${orders.length >= 200 ? ' (os 200 mais recentes; use os filtros para ver outros)' : ''}`"></div>
          </div>
        </div>
      </section>
    </template>

    <!-- ─────────── INDICAÇÕES ─────────── -->
    <template x-if="route.name === 'indicacoes'">
      <section class="stack orders-page">
        <div class="card">
          <div class="card-head"><h3>Links de indicação</h3><span class="small muted" x-text="`${referralData.links.length} ${referralData.links.length === 1 ? 'link' : 'links'}`"></span></div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Quem indica</th><th>Link</th><th class="num">Cliques</th><th class="num">Pedidos</th><th class="num hide-sm">Vendas</th><th class="num hide-sm">Cupons</th></tr></thead>
              <tbody>
                <template x-for="l in referralData.links" :key="l.id">
                  <tr>
                    <td><b x-text="l.name"></b><div class="tiny muted" x-text="[fmt.phone(l.phone), !scope && !isRestaurant ? l.restaurant : ''].filter(Boolean).join(' · ')"></div></td>
                    <td class="small"><button class="btn btn-ghost btn-sm" style="padding-left:0" @click="copyText(l.url)" :title="l.url"><span x-html="icon('copy',14)"></span> <span x-text="`/i/…/${l.slug}`"></span></button></td>
                    <td class="num" x-text="fmt.int(l.clicks)"></td>
                    <td class="num" x-text="fmt.int(l.orders)"></td>
                    <td class="num hide-sm" x-text="fmt.money(l.revenue)"></td>
                    <td class="num hide-sm" x-text="fmt.int(l.rewards)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!referralData.links.length"><div class="empty">Nenhum cliente criou link ainda. Ligue o programa na ficha do restaurante (aba Indicação) e divulgue a página <b>/indicar/&lt;restaurante&gt;</b>.</div></template>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Cupons de quem indicou</h3><span class="small muted">gerados quando o pedido indicado é concluído</span></div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Cupom</th><th>Para</th><th class="hide-sm">Desconto</th><th class="hide-sm">Validade</th><th>Situação</th><th></th></tr></thead>
              <tbody>
                <template x-for="c in referralData.coupons" :key="c.id">
                  <tr>
                    <td><b class="mono" x-text="c.code"></b><div class="tiny muted" x-text="fmt.dateTime(c.createdAt)"></div></td>
                    <td><span x-text="c.contactName || '—'"></span><div class="tiny muted" x-text="c.contactPhone ? fmt.phone(c.contactPhone) : ''"></div></td>
                    <td class="hide-sm small" x-text="discountText(c.discountType, c.discountValue) + (c.minOrder ? ` · mín. ${fmt.money(c.minOrder)}` : '')"></td>
                    <td class="hide-sm small" x-text="c.expiresAt ? new Date(c.expiresAt).toLocaleDateString('pt-BR') : 'sem prazo'"></td>
                    <td><span class="status" :class="couponState(c).cls" x-text="couponState(c).label"></span><div class="tiny" style="color:var(--danger)" x-show="c.sendError && !c.usedAt" x-text="c.sendError"></div></td>
                    <td style="text-align:right"><template x-if="!isRestaurant && !c.usedAt"><button class="btn btn-ghost btn-sm" @click="resendCoupon(c)">Reenviar</button></template></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!referralData.coupons.length"><div class="empty">Os cupons aparecem aqui quando o primeiro pedido de um indicado é concluído.</div></template>
          </div>
        </div>
      </section>
    </template>

    <!-- ─────────── RESTAURANTES ─────────── -->
    <template x-if="route.name === 'restaurantes'">
      <section class="rest-list">
        <template x-for="r in restaurants" :key="r.id">
          <article class="card rest-card" :style="`--c:${r.color || '#73350c'}`">
            <div class="rest-head">
              <span class="mono-mark" x-text="initials(r.name)"></span>
              <div><h3 x-text="r.name"></h3><div class="small muted" x-text="[r.segment, r.city].filter(Boolean).join(' · ')"></div></div>
            </div>
            <div class="rest-body">
              <p class="small" style="margin:0;color:var(--ink-2)" x-text="r.goals || 'Diagnóstico ainda não preenchido.'"></p>
              <div class="rest-nums">
                <div><b x-text="r.authorizedCount"></b><span>contatos</span></div>
                <div><b x-text="r.campaignsCount"></b><span>campanhas</span></div>
                <div><b x-text="(r.menu || []).length"></b><span>itens no cardápio</span></div>
              </div>
              <div class="row-wrap" style="margin-top:auto">
                <button class="btn btn-sm" @click="editRestaurant(r)">Editar diagnóstico</button>
                <button class="btn btn-sm" @click="setScope(r.id); go('#/campanhas/nova')">Nova campanha</button>
                <a class="btn btn-sm btn-ghost" :href="r.siteUrl || r.demoUrl" target="_blank" rel="noopener">Site <span x-html="icon('external',14)"></span></a>
              </div>
            </div>
          </article>
        </template>
        <button class="add-card" @click="editRestaurant(null)">+ Cadastrar restaurante</button>
      </section>
    </template>

    <!-- ─────────── ACESSOS / EQUIPE ─────────── -->
    <template x-if="route.name === 'acessos'">
      <section class="stack" style="grid-template-columns:minmax(0,1fr)">
        <template x-if="resetRequests.length">
          <div class="card card-pad stack" style="gap:10px">
            <h3 style="font-size:16px">Pedidos de nova senha</h3>
            <p class="small muted" style="margin:0">Estas pessoas usaram “Esqueci minha senha”. Gere o link e mande só para a própria pessoa (pelo WhatsApp, por exemplo).</p>
            <template x-for="u in resetRequests" :key="u.id">
              <div class="row-wrap" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px">
                <div><b x-text="u.name"></b> <span class="small muted" x-text="[u.email, !isRestaurant && !scope ? u.restaurant : '', `pediu ${fmt.rel(u.resetRequestedAt)}`].filter(Boolean).join(' · ')"></span></div>
                <button class="btn btn-dark btn-sm" @click="sendLink(u)">Gerar link</button>
              </div>
            </template>
          </div>
        </template>
        <div class="card">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Nome</th><th>Papel</th><th>Situação</th><th></th></tr></thead>
              <tbody>
                <template x-for="u in accessUsers" :key="u.id">
                  <tr>
                    <td>
                      <span x-text="u.name"></span><span class="tiny muted" x-show="u.id === user.userId"> (você)</span>
                      <div class="tiny muted" x-text="[u.email, !isRestaurant && !scope ? u.restaurant : ''].filter(Boolean).join(' · ')"></div>
                    </td>
                    <td x-text="ROLE[u.role] || u.role"></td>
                    <td>
                      <span class="status" :class="accessStatus(u).cls" x-text="accessStatus(u).label"></span>
                      <div class="tiny muted" x-text="u.link && !u.link.expired ? `link vale até ${fmt.dateTime(u.link.expiresAt)}` : (u.lastLoginAt ? `último acesso ${fmt.dateTime(u.lastLoginAt)}` : 'nunca entrou')"></div>
                    </td>
                    <td style="text-align:right;white-space:nowrap">
                      <button class="btn btn-ghost btn-icon btn-sm" x-show="u.id !== user.userId" @click="sendLink(u)" :title="u.status === 'invited' ? 'Gerar link de convite' : 'Gerar link de nova senha'" :aria-label="u.status === 'invited' ? 'Gerar link de convite' : 'Gerar link de nova senha'" x-html="icon('link',15)"></button>
                      <button class="btn btn-ghost btn-icon btn-sm" title="Editar" aria-label="Editar acesso" @click="editAccess(u)" x-html="icon('edit',15)"></button>
                      <button class="btn btn-ghost btn-icon btn-sm" x-show="u.id !== user.userId" title="Remover acesso" aria-label="Remover acesso" @click="removeAccess(u)" x-html="icon('trash',15)"></button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!accessUsers.length"><div class="empty">Ninguém tem acesso ainda. Use “<span x-text="isRestaurant ? 'Convidar pessoa' : 'Novo acesso'"></span>” para começar.</div></template>
          </div>
        </div>
        <div class="card card-pad small muted stack" style="gap:6px">
          <div><b>Gerente</b>: acompanha os pedidos, aprova campanhas, vê os relatórios e cuida dos acessos da equipe do restaurante.</div>
          <div><b>Equipe</b>: acompanha os pedidos, aprova campanhas e vê os relatórios.</div>
          <div>Quem recebe um acesso cria a própria senha por um link (vale por 3 dias e funciona uma vez só). O link de nova senha vale por 2 horas. Mande cada link só para a própria pessoa: quem tem o link entra na conta.</div>
          <div x-show="!isRestaurant">A agência entra com o login definido no arquivo <span class="mono">.env</span> (não aparece nesta lista).</div>
        </div>
      </section>
    </template>

    <!-- ─────────── CONTATOS ─────────── -->
    <template x-if="route.name === 'contatos' && !route.params.id">
      <section class="card">
        <div class="card-head" style="flex-wrap:wrap">
          <div class="row-wrap grow">
            <input class="input" style="max-width:260px" type="search" placeholder="Buscar por nome ou telefone" x-model="contactFilter.search" @input.debounce.300ms="loadContacts()">
            <select class="select" style="width:auto" x-model="contactFilter.tag" @change="loadContacts()">
              <option value="">Todas as tags</option>
              <template x-for="t in contactTags" :key="t.tag"><option :value="t.tag" x-text="`${t.tag} (${t.count})`"></option></template>
            </select>
            <select class="select" style="width:auto" x-model="contactFilter.status" @change="loadContacts()">
              <option value="">Todos</option><option value="authorized">Autorizados</option><option value="optedOut">Descadastrados</option><option value="pending">Sem autorização</option>
            </select>
            <button class="btn" :class="{ 'btn-dark': describeFilters(contactFilters).length }" @click="openFilters('contacts')"><span x-html="icon('search',15)"></span> <span x-text="describeFilters(contactFilters).length ? `Filtros de compra (${describeFilters(contactFilters).length})` : 'Filtrar por compras'"></span></button>
          </div>
          <div class="row-wrap">
            <button class="btn" @click="openImport()"><span x-html="icon('upload',16)"></span> Importar planilha</button>
            <button class="btn btn-dark" @click="editContact(null)">Adicionar</button>
          </div>
        </div>
        <template x-if="describeFilters(contactFilters).length">
          <div class="filter-chips">
            <template x-for="t in describeFilters(contactFilters)" :key="t"><span class="chip" x-text="t"></span></template>
            <button class="btn btn-ghost btn-sm" @click="clearFilters('contacts')">Limpar filtros</button>
          </div>
        </template>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Nome</th><th>WhatsApp</th><th class="hide-sm">Compras</th><th class="hide-sm">Tags</th><th>Situação</th><th></th></tr></thead>
            <tbody>
              <template x-for="c in contacts.slice(0, 300)" :key="c.id">
                <tr>
                  <td>
                    <a :href="`#/contatos/${c.id}`" class="contact-link" x-text="c.name || '—'"></a>
                    <div class="tiny muted" x-show="!scope" x-text="restaurantById(c.restaurantId)?.name"></div>
                    <div class="tiny muted" x-show="c.neighborhood || c.purchase?.lastNeighborhood || c.birthDay" x-text="[c.neighborhood || c.purchase?.lastNeighborhood, c.birthDay ? `aniversário ${c.birthDay}/${String(c.birthMonth).padStart(2, '0')}` : ''].filter(Boolean).join(' · ')"></div>
                  </td>
                  <td class="num" style="white-space:nowrap" x-text="fmt.phone(c.phone)"></td>
                  <td class="hide-sm small" style="white-space:nowrap">
                    <template x-if="c.purchase?.orders">
                      <div><span><b x-text="fmt.int(c.purchase.orders)"></b> <span x-text="c.purchase.orders === 1 ? 'pedido' : 'pedidos'"></span> · <span x-text="fmt.money(c.purchase.total)"></span></span><div class="tiny muted" :title="fmt.dateTime(c.purchase.lastAt)" x-text="`última ${fmt.rel(c.purchase.lastAt)}`"></div></div>
                    </template>
                    <span class="muted" x-show="!c.purchase?.orders">—</span>
                  </td>
                  <td class="hide-sm"><div class="row-wrap" style="gap:4px"><template x-for="t in c.tags" :key="t"><span class="chip" x-text="t"></span></template></div></td>
                  <td><span class="status" :class="contactStatus(c).cls" x-text="contactStatus(c).label"></span><div class="tiny muted hide-sm" x-show="c.optInSource" x-text="c.optInSource"></div></td>
                  <td style="text-align:right;white-space:nowrap">
                    <button class="btn btn-ghost btn-sm" @click="editContact(c)">Editar</button>
                    <button class="btn btn-ghost btn-sm" @click="toggleOptOut(c)" x-text="c.optedOut ? 'Reativar' : 'Descadastrar'"></button>
                    <button class="btn btn-ghost btn-icon btn-sm" title="Remover" aria-label="Remover" @click="deleteContact(c)" x-html="icon('trash',15)"></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <template x-if="!contacts.length"><div class="empty">Nenhum contato encontrado.</div></template>
          <div class="small muted" style="padding:10px 16px" x-show="contacts.length" x-text="`${fmt.int(contacts.length)} contatos${contacts.length > 300 ? ' (mostrando 300)' : ''}`"></div>
        </div>
      </section>
    </template>

    <!-- ─────────── FICHA DO CLIENTE ─────────── -->
    <template x-if="route.name === 'contatos' && contactProfile">
      <section class="stack profile-page">
        <div class="card card-pad profile-head">
          <div class="grow stack" style="gap:6px">
            <div class="row-wrap" style="gap:8px">
              <span class="status" :class="contactStatus(contactProfile).cls" x-text="contactStatus(contactProfile).label"></span>
              <template x-for="t in contactProfile.tags" :key="t"><span class="chip" x-text="t"></span></template>
            </div>
            <div class="row-wrap small" style="gap:14px">
              <a :href="waLink(contactProfile.phone)" target="_blank" rel="noopener" x-text="fmt.phone(contactProfile.phone)"></a>
              <span x-show="contactProfile.birthDay" x-text="`Aniversário: ${birthdayText(contactProfile)}`"></span>
              <span x-show="contactProfile.profile.neighborhood" x-text="`Bairro: ${contactProfile.profile.neighborhood}${contactProfile.neighborhood ? '' : ' (do último pedido)'}`"></span>
              <span class="muted" x-show="contactProfile.optInSource" x-text="`Autorização: ${contactProfile.optInSource}`"></span>
              <span class="muted" x-text="`Na base desde ${fmt.date(contactProfile.createdAt)}`"></span>
            </div>
          </div>
          <div class="row-wrap">
            <button class="btn" @click="editContact(contactProfile)">Editar</button>
            <button class="btn btn-ghost" @click="toggleOptOut(contactProfile)" x-text="contactProfile.optedOut ? 'Reativar' : 'Descadastrar'"></button>
            <button class="btn btn-ghost btn-icon" title="Remover" aria-label="Remover" @click="deleteContact(contactProfile)" x-html="icon('trash',15)"></button>
          </div>
        </div>

        <div class="card stats profile-stats">
          <div><div class="label-up">Pedidos</div><div class="value" x-text="fmt.int(contactProfile.profile.orders)"></div><div class="foot" x-text="contactProfile.profile.orders ? `ticket médio ${fmt.money(contactProfile.profile.ticket)}` : 'ainda não comprou'"></div></div>
          <div><div class="label-up">Total gasto</div><div class="value" x-text="fmt.money(contactProfile.profile.total)"></div><div class="foot">pedidos não cancelados</div></div>
          <div><div class="label-up">Última compra</div><div class="value" x-text="contactProfile.profile.lastAt ? fmt.date(contactProfile.profile.lastAt) : '—'"></div><div class="foot" x-text="contactProfile.profile.daysSinceLast === null ? '' : contactProfile.profile.daysSinceLast === 0 ? 'hoje' : `há ${contactProfile.profile.daysSinceLast} ${contactProfile.profile.daysSinceLast === 1 ? 'dia' : 'dias'}`"></div></div>
          <div><div class="label-up">Primeira compra</div><div class="value" x-text="contactProfile.profile.firstAt ? fmt.date(contactProfile.profile.firstAt) : '—'"></div><div class="foot" x-text="contactProfile.profile.firstAt ? new Date(contactProfile.profile.firstAt).getFullYear() : ''"></div></div>
          <div><div class="label-up">Prefere pedir</div><div class="value" style="font-size:22px" x-text="contactProfile.profile.weekday === null ? '—' : WEEKDAYS[contactProfile.profile.weekday]"></div><div class="foot" x-text="contactProfile.profile.topItem ? `mais pede: ${contactProfile.profile.topItem}` : ''"></div></div>
        </div>

        <div class="dash-grid">
          <div class="card">
            <div class="card-head"><h3>Pedidos</h3><span class="small muted" x-text="contactProfile.orders.length >= 100 ? 'os 100 mais recentes' : ''"></span></div>
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>Pedido</th><th class="hide-sm">Origem</th><th>Situação</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>
                  <template x-for="o in contactProfile.orders" :key="o.id">
                    <tr @click="openOrder(o)" style="cursor:pointer">
                      <td><b x-text="orderLabel(o)"></b><div class="tiny muted" x-text="fmt.dateTime(o.createdAt)"></div></td>
                      <td class="hide-sm small"><span x-text="ORDER_SOURCE[o.source] || o.source"></span><span class="muted" x-show="o.channel" x-text="` · ${o.channel}`"></span></td>
                      <td><span class="status" :class="ORDER_CLASS[o.status]" x-text="orderStatusLabel(o)"></span></td>
                      <td class="num" style="text-align:right" x-text="fmt.money(o.value)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template x-if="!contactProfile.orders.length"><div class="empty">Nenhum pedido deste cliente ainda.</div></template>
            </div>
          </div>
          <div class="stack">
            <div class="card">
              <div class="card-head"><h3>O que mais pede</h3></div>
              <ul class="orders">
                <template x-for="it in contactProfile.topItems" :key="it.name"><li><span x-text="it.name"></span><span class="val" x-text="`${fmt.int(it.qty)}×`"></span></li></template>
              </ul>
              <template x-if="!contactProfile.topItems.length"><div class="empty">Sem itens nos pedidos.</div></template>
            </div>
            <div class="card">
              <div class="card-head"><h3>Campanhas recebidas</h3></div>
              <ul class="orders">
                <template x-for="m in contactProfile.messages" :key="m.campaignId + (m.sentAt || '')">
                  <li><div><a :href="`#/campanhas/${m.campaignId}`" x-text="m.campaign"></a><div class="tiny muted" x-text="m.sentAt ? fmt.dateTime(m.sentAt) : 'não enviada'"></div></div><span class="status val" :class="messageLabel(m).cls" x-text="messageLabel(m).label"></span></li>
                </template>
              </ul>
              <template x-if="!contactProfile.messages.length"><div class="empty">Este cliente ainda não recebeu campanhas.</div></template>
            </div>
          </div>
        </div>
      </section>
    </template>

    <!-- ─────────── CAMPANHAS (lista) ─────────── -->
    <template x-if="route.name === 'campanhas' && !route.params.id">
      <section>
        <div class="filters">
          <template x-for="f in (isRestaurant ? [['all','Todas'],['approval','Para aprovar'],['completed','Enviadas']] : [['all','Todas'],['approval','Aguardando aprovação'],['active','Em andamento'],['draft','Rascunhos'],['completed','Concluídas']])" :key="f[0]">
            <button :class="{ on: campaignFilter === f[0] }" @click="campaignFilter = f[0]"><span x-text="f[1]"></span><small x-text="campaignCount(f[0])"></small></button>
          </template>
        </div>
        <div class="card table-wrap">
          <table class="table camp-table">
            <thead><tr><th>Campanha</th><th>Situação</th><th>Enviadas</th><th class="hide-sm">Leitura</th><th>Cliques</th><th>Pedidos</th><th style="text-align:right">Vendas</th></tr></thead>
            <tbody>
              <template x-for="c in filteredCampaigns" :key="c.id">
                <tr @click="openCampaign(c)">
                  <td>
                    <b x-text="c.name"></b>
                    <div class="tiny muted" x-text="[c.restaurant, c.status === 'scheduled' ? `envio em ${fmt.dateTime(c.scheduledAt)}` : c.startedAt ? fmt.dateTime(c.startedAt) : `criada ${fmt.rel(c.createdAt)}`].join(' · ')"></div>
                    <template x-if="c.status === 'sending' || c.status === 'paused'"><div class="mini-bar" style="margin-top:6px;max-width:220px"><span :style="`width:${c.stats.progress}%`"></span></div></template>
                  </td>
                  <td><span class="status" :class="campaignClass(c)" x-text="campaignLabel(c)"></span></td>
                  <td class="num" x-text="fmt.int(c.stats.sent)"></td>
                  <td class="num hide-sm" x-text="c.stats.sent ? fmt.pct(c.stats.readRate) : '—'"></td>
                  <td class="num" x-text="fmt.int(c.stats.clicked)"></td>
                  <td class="num" x-text="fmt.int(c.stats.orders)"></td>
                  <td class="num" style="text-align:right" x-text="fmt.money(c.stats.revenue)"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <template x-if="!filteredCampaigns.length"><div class="empty">Nenhuma campanha neste filtro. <a href="#/campanhas/nova">Criar campanha</a></div></template>
        </div>
      </section>
    </template>

    <!-- ─────────── EDITOR DE CAMPANHA ─────────── -->
    <template x-if="route.name === 'campanhas' && editor">
      <section>
        <nav class="steps">
          <template x-for="s in [[1,'Planejamento'],[2,'Mensagem'],[3,'Público'],[4,'Envio']]" :key="s[0]">
            <button :class="{ on: editor.step === s[0], done: editor.step > s[0] }" @click="goStep(s[0])"><span class="n" x-text="s[0]"></span><span x-text="s[1]"></span></button>
          </template>
        </nav>

        <div class="editor-grid">
          <div class="stack">
            <!-- 1. Planejamento -->
            <template x-if="editor.step === 1">
              <div class="card card-pad stack">
                <div class="grid-2">
                  <div class="field">
                    <label>Restaurante</label>
                    <select class="select" x-model="editor.form.restaurantId" @change="editor.form.coupon = editor.form.coupon || editorRestaurant?.coupon || ''; refreshEditorTags()">
                      <template x-for="r in restaurants" :key="r.id"><option :value="r.id" x-text="r.name" :selected="r.id === editor.form.restaurantId"></option></template>
                    </select>
                  </div>
                  <div class="field"><label>Nome interno</label><input class="input" x-model="editor.form.name" placeholder="Ex.: Sexta de massas, outubro"></div>
                  <div class="field">
                    <label>Objetivo</label>
                    <input class="input" list="objectives" x-model="editor.form.objective">
                    <datalist id="objectives"><template x-for="o in OBJECTIVES"><option :value="o"></option></template></datalist>
                  </div>
                  <div class="field"><label>Ocasião</label><input class="input" x-model="editor.form.occasion" placeholder="Ex.: Dia das Mães"></div>
                  <div class="field"><label>Cupom</label><input class="input" x-model="editor.form.coupon" style="text-transform:uppercase"><span class="hint">Entra na mensagem onde estiver {{cupom}}.</span></div>
                  <div class="field"><label>Link de destino</label><input class="input" type="url" x-model="editor.form.destinationUrl" :placeholder="editorRestaurant?.siteUrl || editorRestaurant?.demoUrl"><span class="hint">Em branco, vai para o site do restaurante.</span></div>
                </div>
                <template x-if="editorRestaurant && editorRestaurant.goals">
                  <p class="note" style="margin:0"><b>Objetivo do restaurante:</b> <span x-text="editorRestaurant.goals"></span></p>
                </template>
                <div>
                  <div class="label" style="margin-bottom:8px">Começar de um modelo</div>
                  <div class="ideas">
                    <template x-for="idea in meta.ideas" :key="idea.id">
                      <button class="idea" @click="applyIdea(idea)"><b x-text="idea.title"></b><small x-text="idea.objective"></small></button>
                    </template>
                  </div>
                </div>
                <div class="row" style="justify-content:flex-end"><button class="btn btn-dark" @click="goStep(2)">Continuar</button></div>
              </div>
            </template>

            <!-- 2. Mensagem -->
            <template x-if="editor.step === 2">
              <div class="card card-pad stack">
                <div class="field">
                  <label>Texto</label>
                  <div>
                    <div class="toolbar">
                      <template x-for="v in meta.variables" :key="v.key"><button type="button" class="tool" @click="insertAtCursor(`{{${v.key}}}`)" :title="`Ex.: ${v.sample}`" x-text="v.label"></button></template>
                      <span style="width:1px;height:18px;background:var(--line-2);margin:0 4px"></span>
                      <button type="button" class="tool" @click="wrapSelection('*')" title="Negrito"><b>N</b></button>
                      <button type="button" class="tool" @click="wrapSelection('_')" title="Itálico"><i>I</i></button>
                      <button type="button" class="tool" @click="insertAtCursor('{Oi|Olá}')" title="Cada cliente recebe uma das opções">Variação</button>
                      <template x-for="e in EMOJIS.slice(0, 8)"><button type="button" class="tool" style="padding:2px 5px" @click="insertAtCursor(e)" x-text="e"></button></template>
                    </div>
                    <textarea class="textarea" x-ref="msg" x-model="editor.form.message"></textarea>
                    <div class="tiny muted" style="text-align:right;margin-top:4px" x-text="`${editor.form.message.length} caracteres`"></div>
                  </div>
                </div>
                <template x-if="messageWarnings.length">
                  <ul class="small muted" style="margin:-6px 0 0;padding-left:18px"><template x-for="w in messageWarnings"><li x-text="w"></li></template></ul>
                </template>

                <div class="field">
                  <label>Imagem</label>
                  <div class="upload" :class="{ drag: dragOver }" @dragover.prevent="dragOver=true" @dragleave="dragOver=false" @drop.prevent="onDrop($event)">
                    <template x-if="editor.form.mediaUrl"><img class="thumb" :src="editor.form.mediaUrl" alt=""></template>
                    <template x-if="!editor.form.mediaUrl"><div class="thumb" x-html="icon('image',28)"></div></template>
                    <div class="stack" style="gap:6px">
                      <div class="small" x-text="editor.form.mediaUrl ? 'A imagem vai junto com o texto, que vira a legenda.' : 'Arraste uma foto aqui ou escolha do computador. JPG, PNG ou WEBP até 5 MB.'"></div>
                      <div class="row-wrap">
                        <label class="btn btn-sm" :class="{ 'btn-dark': !editor.form.mediaUrl }">
                          <span class="spin" x-show="uploading"></span>
                          <span x-text="editor.form.mediaUrl ? 'Trocar imagem' : 'Escolher imagem'"></span>
                          <input type="file" accept="image/jpeg,image/png,image/webp" class="sr-only" @change="uploadImage($event.target.files[0]); $event.target.value=''">
                        </label>
                        <template x-if="editor.form.mediaUrl"><button type="button" class="btn btn-sm btn-ghost" @click="editor.form.mediaUrl=''">Remover</button></template>
                      </div>
                    </div>
                  </div>
                  <template x-if="uploads.length">
                    <div style="margin-top:6px">
                      <div class="hint" style="margin-bottom:6px">Imagens já enviadas</div>
                      <div class="gallery">
                        <template x-for="u in uploads.slice(0, 12)" :key="u.file">
                          <button type="button" :class="{ on: editor.form.mediaUrl === u.url }" @click="editor.form.mediaUrl = u.url" :title="u.name"><img :src="u.url" :alt="u.name" loading="lazy"></button>
                        </template>
                      </div>
                    </div>
                  </template>
                  <details style="margin-top:4px"><summary class="small muted" style="cursor:pointer">Usar um link de imagem</summary><input class="input" style="margin-top:6px" type="url" x-model="editor.form.mediaUrl" placeholder="https://"></details>
                </div>

                <label class="check"><input type="checkbox" x-model="editor.form.includeFooter"><span>Incluir no final: <span class="muted" x-text="settings.footer"></span></span></label>

                <details :open="editor.showCloud">
                  <summary class="small" style="cursor:pointer;font-weight:600">Template da API Oficial (usado só quando o canal for a API da Meta)</summary>
                  <div class="grid-2" style="margin-top:12px">
                    <div class="field"><label>Nome do template aprovado</label><input class="input mono" x-model="editor.form.cloudTemplate.name" placeholder="promo_restaurante_v1"></div>
                    <div class="field"><label>Idioma</label><input class="input mono" x-model="editor.form.cloudTemplate.language" placeholder="pt_BR"></div>
                    <div class="field" style="grid-column:1/-1"><label>Parâmetros {{1}}, {{2}}… (um por linha)</label><textarea class="textarea mono" style="min-height:84px" x-model="editor.form.cloudTemplate.paramsText" placeholder="{{primeiro_nome}}&#10;{{cupom}}&#10;{{link}}"></textarea></div>
                  </div>
                </details>
                <div class="row between">
                  <button class="btn btn-ghost" @click="goStep(1)">Voltar</button>
                  <div class="row"><button class="btn" @click="saveCampaign()" :disabled="editor.saving">Salvar rascunho</button><button class="btn btn-dark" @click="goStep(3)">Continuar</button></div>
                </div>
              </div>
            </template>

            <!-- 3. Público -->
            <template x-if="editor.step === 3">
              <div class="card card-pad stack">
                <div class="audience"><b x-text="fmt.int(editor.audience.count)"></b><span>contatos vão receber. Só entram clientes que autorizaram e não pediram para sair.</span></div>
                <div class="field">
                  <label>Filtrar por tag</label>
                  <div class="row-wrap">
                    <template x-for="t in editor.tags" :key="t.tag">
                      <button type="button" class="chip chip-toggle" :class="{ on: editor.form.segment.tags.includes(t.tag) }" @click="toggleTag(t.tag)"><span x-text="t.tag"></span> <span style="opacity:.6" x-text="t.count"></span></button>
                    </template>
                    <template x-if="!editor.tags.length"><span class="small muted">Os contatos deste restaurante ainda não têm tags.</span></template>
                  </div>
                  <span class="hint">Sem tag marcada, a campanha vai para toda a base autorizada.</span>
                </div>
                <div class="field">
                  <label>Filtrar por compras</label>
                  <div class="row-wrap">
                    <template x-for="t in describeFilters(editor.form.segment.filters)" :key="t"><span class="chip" x-text="t"></span></template>
                    <button type="button" class="btn btn-sm" @click="openFilters('editor')" x-text="describeFilters(editor.form.segment.filters).length ? 'Alterar filtros' : 'Escolher filtros'"></button>
                    <button type="button" class="btn btn-ghost btn-sm" x-show="describeFilters(editor.form.segment.filters).length" @click="clearFilters('editor')">Limpar</button>
                  </div>
                  <span class="hint">Última compra, quantidade de pedidos, total gasto, aniversário, bairro, item mais pedido e dia da semana preferido.</span>
                </div>
                <div class="row" x-show="editor.form.segment.tags.length > 1">
                  <span class="small">Precisa ter</span>
                  <div class="seg">
                    <button :class="{ on: editor.form.segment.match === 'any' }" @click="editor.form.segment.match='any'; refreshAudience()">qualquer uma</button>
                    <button :class="{ on: editor.form.segment.match === 'all' }" @click="editor.form.segment.match='all'; refreshAudience()">todas</button>
                  </div>
                </div>
                <template x-if="editor.audience.sample?.length">
                  <p class="small muted" style="margin:0" x-text="'Ex.: ' + editor.audience.sample.map(s => s.name || fmt.phone(s.phone)).join(', ')"></p>
                </template>
                <div class="row between">
                  <button class="btn btn-ghost" @click="goStep(2)">Voltar</button>
                  <button class="btn btn-dark" @click="goStep(4)" :disabled="!editor.audience.count">Continuar</button>
                </div>
              </div>
            </template>

            <!-- 4. Envio -->
            <template x-if="editor.step === 4">
              <div class="stack">
                <div class="card card-pad">
                  <dl class="summary">
                    <dt>Restaurante</dt><dd x-text="editorRestaurant?.name"></dd>
                    <dt>Objetivo</dt><dd x-text="editor.form.objective || '—'"></dd>
                    <dt>Público</dt><dd x-text="`${fmt.int(editor.audience.count)} contatos (${segmentText(editor.form.segment)})`"></dd>
                    <dt>Imagem</dt><dd x-text="editor.form.mediaUrl ? 'Sim' : 'Não'"></dd>
                    <dt>Canal</dt><dd><span class="status" :class="conn.state" x-text="`${conn.label} · ${CONN[conn.state]}`"></span></dd>
                    <dt>Tempo estimado</dt><dd x-text="estimate"></dd>
                    <dt>Link</dt><dd class="small" style="word-break:break-all" x-text="editor.form.destinationUrl || editorRestaurant?.siteUrl || editorRestaurant?.demoUrl"></dd>
                  </dl>
                  <template x-if="conn.state !== 'connected'">
                    <p class="note red" style="margin:14px 0 0">O canal está desconectado. A campanha pode ser iniciada e fica na fila até a conexão voltar. <a href="#/conexao">Conectar</a></p>
                  </template>
                </div>
                <template x-if="editorRestaurant?.requireApproval !== false">
                  <div class="card card-pad stack approval-box" :class="editor.form.approval?.status || 'none'">
                    <div class="row between" style="flex-wrap:wrap">
                      <h3 style="font-size:15.5px">Aprovação do restaurante</h3>
                      <span class="status" :class="{ pending: 'sending', approved: 'completed', changes: 'failed' }[editor.form.approval?.status] || 'draft'" x-text="APPROVAL[editor.form.approval?.status] || 'Ainda não enviada'"></span>
                    </div>
                    <template x-if="!editor.form.approval || editor.form.approval.status === 'changes'">
                      <div class="stack" style="gap:10px">
                        <template x-if="editor.form.approval?.status === 'changes'">
                          <p class="note red" style="margin:0"><b x-text="`${editor.form.approval.decidedBy} pediu:`"></b> <span x-text="editor.form.approval.note"></span></p>
                        </template>
                        <p class="small muted" style="margin:0">O restaurante entra no painel com o acesso dele, vê a mensagem como o cliente vai receber e aprova ou pede ajustes. Qualquer mudança no texto, imagem, cupom, link ou público depois disso exige nova aprovação.</p>
                        <textarea class="textarea" style="min-height:60px" x-model="approvalNote" placeholder="Recado para o restaurante (opcional)"></textarea>
                        <button class="btn btn-dark" style="justify-self:start" @click="requestApproval" x-text="editor.form.approval ? 'Enviar de novo para aprovação' : 'Enviar para aprovação'"></button>
                      </div>
                    </template>
                    <template x-if="editor.form.approval?.status === 'pending'">
                      <p class="small muted" style="margin:0" x-text="`Enviada em ${fmt.dateTime(editor.form.approval.requestedAt)}. O envio fica liberado quando o restaurante aprovar.`"></p>
                    </template>
                    <template x-if="editor.form.approval?.status === 'approved'">
                      <p class="small" style="margin:0" x-text="`Aprovada por ${editor.form.approval.decidedBy} em ${fmt.dateTime(editor.form.approval.decidedAt)}${editor.form.approval.note ? ': “' + editor.form.approval.note + '”' : '.'}`"></p>
                    </template>
                  </div>
                </template>
                <div class="card card-pad stack">
                  <h3 style="font-size:15.5px">Teste no seu WhatsApp</h3>
                  <div class="row-wrap">
                    <input class="input" style="max-width:240px" x-model="testPhone" placeholder="(31) 99999-9999" inputmode="tel">
                    <button class="btn" @click="sendTest" :disabled="editor.sendingTest"><span class="spin" x-show="editor.sendingTest"></span> Enviar teste</button>
                  </div>
                </div>
                <div class="card card-pad stack">
                  <h3 style="font-size:15.5px">Quando enviar</h3>
                  <div class="row-wrap" style="gap:20px">
                    <label class="check"><input type="radio" name="when" :checked="!editor.scheduling" @change="editor.scheduling=false"> Agora</label>
                    <label class="check"><input type="radio" name="when" :checked="editor.scheduling" @change="editor.scheduling=true"> Agendar</label>
                    <template x-if="editor.scheduling"><input class="input" type="datetime-local" x-model="editor.scheduledAt" style="max-width:240px"></template>
                  </div>
                  <template x-if="editor.form.status === 'scheduled'"><p class="note" style="margin:0">Já agendada. <a href="" @click.prevent="unschedule()">Cancelar agendamento</a></p></template>
                </div>
                <div class="row between">
                  <button class="btn btn-ghost" @click="goStep(3)">Voltar</button>
                  <button class="btn btn-primary btn-lg" @click="launch" :disabled="editor.starting || !editor.audience.count || needsApproval" :title="needsApproval ? 'Aguardando aprovação do restaurante' : ''" x-text="needsApproval ? 'Aguardando aprovação' : editor.scheduling ? 'Agendar envio' : `Enviar para ${fmt.int(editor.audience.count)} contatos`"></button>
                </div>
              </div>
            </template>
          </div>

          <!-- Pré-visualização -->
          <aside class="preview-col">
            <div class="phone">
              <div class="phone-screen">
                <div class="wa-top">
                  <span class="wa-avatar" :style="`--c:${editorRestaurant?.color || '#73350c'}`" x-text="initials(editorRestaurant?.name)"></span>
                  <div><div class="name" x-text="editorRestaurant?.name || 'Restaurante'"></div><div class="sub">conta comercial</div></div>
                </div>
                <div class="wa-chat">
                  <span class="wa-day">HOJE</span>
                  <template x-if="previewText">
                    <div class="wa-bubble">
                      <template x-if="editor.form.mediaUrl"><img :src="editor.form.mediaUrl" alt="" @error="$el.style.display='none'"></template>
                      <div class="wa-text" x-html="waFormat(previewText)"></div>
                      <div class="wa-meta"><span>18:30</span></div>
                    </div>
                  </template>
                </div>
                <div class="wa-input"><span>Mensagem</span><i>➤</i></div>
              </div>
            </div>
            <button class="btn btn-sm btn-ghost" @click="editor.seed++" x-show="previewText && /\{[^{}]*\|/.test(editor.form.message)">Ver outra variação</button>
          </aside>
        </div>
      </section>
    </template>

    <!-- ─────────── DETALHE DA CAMPANHA ─────────── -->
    <!-- Aprovação (campanha ainda não enviada, visão do restaurante) -->
    <template x-if="route.name === 'campanhas' && detail && isApprovalView">
      <section class="approval-grid">
        <div class="stack">
          <div class="card card-pad stack">
            <div class="row between" style="flex-wrap:wrap">
              <span class="status" :class="campaignClass(detail)" x-text="campaignLabel(detail)"></span>
              <span class="small muted" x-show="detail.approval?.requestedAt" x-text="`Enviada pela ${detail.approval?.requestedBy} em ${fmt.dateTime(detail.approval?.requestedAt)}`"></span>
            </div>
            <dl class="summary">
              <dt>Objetivo</dt><dd x-text="detail.objective || '—'"></dd>
              <dt>Quem recebe</dt><dd x-text="`${fmt.int(detail.audiencePreview || 0)} clientes da sua base` + (detail.segment?.tags?.length || describeFilters(detail.segment?.filters).length ? ` (${segmentText(detail.segment)})` : '')"></dd>
              <dt>Cupom</dt><dd x-text="detail.coupon || '—'"></dd>
              <dt>Envio</dt><dd x-text="detail.scheduledAt ? fmt.dateTime(detail.scheduledAt) : 'Logo após a aprovação'"></dd>
              <dt>Link</dt><dd class="small" style="word-break:break-all" x-text="detail.destinationUrl || restaurants[0]?.siteUrl || restaurants[0]?.demoUrl"></dd>
            </dl>
            <template x-if="(detail.approvalLog || []).filter(l => l.action === 'requested' && l.note).length">
              <p class="note" style="margin:0" x-text="'Recado da Studio Coral: ' + detail.approvalLog.filter(l => l.action === 'requested' && l.note).slice(-1)[0].note"></p>
            </template>
          </div>

          <template x-if="detail.approval?.status === 'pending'">
            <div class="card card-pad stack">
              <h3 style="font-size:16px">Sua decisão</h3>
              <textarea class="textarea" style="min-height:80px" x-model="approvalNote" placeholder="Comentário (obrigatório se pedir ajustes)"></textarea>
              <div class="row-wrap">
                <button class="btn btn-primary btn-lg" @click="decide('approve')">Aprovar campanha</button>
                <button class="btn btn-lg" @click="decide('request-changes')">Pedir ajustes</button>
              </div>
            </div>
          </template>
          <template x-if="detail.approval?.status === 'approved'">
            <p class="note green" style="margin:0" x-text="`Você aprovou em ${fmt.dateTime(detail.approval.decidedAt)}. A Studio Coral cuida do envio.`"></p>
          </template>
          <template x-if="detail.approval?.status === 'changes'">
            <p class="note red" style="margin:0" x-text="`Ajustes pedidos: “${detail.approval.note}”. A Studio Coral vai mandar uma nova versão.`"></p>
          </template>

          <div class="card">
            <div class="card-head"><h3>Histórico</h3></div>
            <ul class="orders">
              <template x-for="(l, i) in (detail.approvalLog || []).slice().reverse()" :key="i">
                <li><div><b x-text="l.by"></b> <span x-text="approvalText(l)"></span><div class="tiny muted" x-show="l.note" x-text="`“${l.note}”`"></div></div><span class="val tiny muted" style="font-weight:400" x-text="fmt.dateTime(l.at)"></span></li>
              </template>
            </ul>
          </div>
        </div>

        <aside class="preview-col">
          <div class="phone">
            <div class="phone-screen">
              <div class="wa-top">
                <span class="wa-avatar" :style="`--c:${restaurants.find(r => r.id === detail.restaurantId)?.color || '#73350c'}`" x-text="initials(detail.restaurant)"></span>
                <div><div class="name" x-text="detail.restaurant"></div><div class="sub">conta comercial</div></div>
              </div>
              <div class="wa-chat">
                <span class="wa-day">HOJE</span>
                <div class="wa-bubble">
                  <template x-if="detail.mediaUrl"><img :src="detail.mediaUrl" alt=""></template>
                  <div class="wa-text" x-html="waFormat(detailSample)"></div>
                  <div class="wa-meta"><span>18:30</span></div>
                </div>
              </div>
              <div class="wa-input"><span>Mensagem</span><i>➤</i></div>
            </div>
          </div>
          <p class="tiny muted center" style="margin:0;max-width:280px">Exemplo com o nome de um cliente. Cada pessoa recebe a mensagem com o próprio nome e um link só dela.</p>
        </aside>
      </section>
    </template>

    <template x-if="route.name === 'campanhas' && detail && !isApprovalView">
      <section class="stack">
        <div class="card card-pad">
          <div class="row-wrap between">
            <div class="row-wrap" style="gap:14px">
              <span class="status" :class="detail.status" x-text="STATUS[detail.status]"></span>
              <span class="small muted" x-text="`Início ${fmt.dateTime(detail.startedAt)}${detail.completedAt ? ' · fim ' + fmt.dateTime(detail.completedAt) : ''}`"></span>
            </div>
            <div class="row-wrap" x-show="!isRestaurant">
              <template x-if="detail.status === 'sending'"><button class="btn btn-sm" @click="campaignAction('pause')">Pausar</button></template>
              <template x-if="detail.status === 'paused'"><button class="btn btn-sm btn-dark" @click="campaignAction('resume')">Retomar</button></template>
              <template x-if="['sending','paused'].includes(detail.status)"><button class="btn btn-sm btn-danger" @click="campaignAction('cancel')">Cancelar envio</button></template>
              <button class="btn btn-sm" @click="duplicate(detail)">Duplicar</button>
              <template x-if="['completed','canceled'].includes(detail.status)"><button class="btn btn-sm btn-ghost" @click="deleteCampaign(detail)">Excluir</button></template>
            </div>
          </div>
          <div class="progress-line"><span :style="`width:${detail.stats.progress}%`"></span></div>
          <div class="small muted" x-text="`${detail.stats.processed} de ${detail.stats.audience} processadas`"></div>
          <template x-if="detail.waitingReason && detail.status === 'sending'"><p class="note" style="margin:12px 0 0"><span x-text="detail.waitingReason"></span>. <a href="#/conexao" x-show="detail.waitingReason.includes('conexão')">Abrir conexão</a></p></template>
        </div>

        <div class="card stats" style="grid-template-columns:repeat(6,minmax(0,1fr))">
          <div><div class="label-up">Enviadas</div><div class="value" x-text="fmt.int(detail.stats.sent)"></div><div class="foot" x-text="`${detail.stats.failed} falharam`"></div></div>
          <div><div class="label-up">Entregues</div><div class="value" x-text="fmt.pct(detail.stats.deliveryRate)"></div><div class="foot" x-text="`${detail.stats.delivered} mensagens`"></div></div>
          <div><div class="label-up">Lidas</div><div class="value" x-text="fmt.pct(detail.stats.readRate)"></div><div class="foot" x-text="`${detail.stats.read} mensagens`"></div></div>
          <div><div class="label-up">Cliques</div><div class="value" x-text="fmt.int(detail.stats.clicked)"></div><div class="foot" x-text="`${fmt.pct(detail.stats.clickRate)} das entregues`"></div></div>
          <div><div class="label-up">Pedidos</div><div class="value" x-text="fmt.int(detail.stats.orders)"></div><div class="foot" x-text="`${fmt.pct(detail.stats.conversionRate)} de quem clicou`"></div></div>
          <div class="money"><div class="label-up">Vendas</div><div class="value" x-text="fmt.money(detail.stats.revenue)"></div><div class="foot" x-text="`${detail.stats.replied} respostas`"></div></div>
        </div>

        <div class="dash-grid" style="margin:0">
          <div class="card">
            <div class="card-head" style="flex-wrap:wrap">
              <h3>Envios</h3>
              <div class="row-wrap">
                <input class="input" type="search" style="width:170px;min-height:34px" placeholder="Buscar" x-model="detailFilter.search">
                <select class="select" style="width:auto;min-height:34px" x-model="detailFilter.status">
                  <option value="">Todos</option>
                  <template x-for="e in Object.entries(MSG_STATUS)" :key="e[0]"><option :value="e[0]" x-text="e[1]"></option></template>
                  <option value="clicked">Clicaram</option><option value="converted">Compraram</option>
                </select>
              </div>
            </div>
            <div class="table-wrap" style="max-height:560px;overflow:auto">
              <table class="table">
                <thead><tr><th>Cliente</th><th>Situação</th><th class="hide-sm">Hora</th><th></th></tr></thead>
                <tbody>
                  <template x-for="m in filteredMessages.slice(0, 400)" :key="m.id">
                    <tr>
                      <td><span x-text="m.name || '—'"></span><div class="tiny muted num" x-text="fmt.phone(m.phone)"></div></td>
                      <td><span class="status" :class="m.status" x-text="MSG_STATUS[m.status]"></span><div class="tiny" style="color:var(--danger);max-width:240px" x-show="m.error" x-text="m.error"></div></td>
                      <td class="hide-sm small muted" x-text="m.sentAt ? fmt.time(m.sentAt) : '—'"></td>
                      <td><span class="flags">
                        <span x-show="m.clickedAt" x-text="m.clicks > 1 ? `${m.clicks} cliques` : 'clicou'"></span>
                        <span class="order" x-show="m.convertedAt">pediu</span>
                        <span x-show="m.repliedAt" :title="m.reply" x-text="m.optOut ? 'saiu da lista' : 'respondeu'"></span>
                      </span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template x-if="!filteredMessages.length"><div class="empty">Nada com esse filtro.</div></template>
            </div>
          </div>
          <div class="stack">
            <div class="card">
              <div class="card-head"><h3>Da mensagem ao pedido</h3></div>
              <div class="card-pad funnel">
                <template x-for="s in funnel(detail.stats)" :key="s.label">
                  <div class="funnel-row">
                    <span x-text="s.label"></span>
                    <div class="bar" :class="{ low: s.low }"><span :style="`width:${s.width}%;background:${s.color}`"></span><b x-text="fmt.int(s.value)"></b></div>
                    <span class="rate" x-text="s.rate + '%'"></span>
                  </div>
                </template>
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h3>Mensagem enviada</h3><span class="small muted" x-text="'como chegou para ' + ((detailMessages.find(x => x.sentAt) || {}).name || 'o cliente')"></span></div>
              <div class="card-pad" style="background:#efe6d8;border-radius:0 0 var(--r-lg) var(--r-lg)">
                <div class="wa-bubble" style="max-width:100%">
                  <template x-if="detail.mediaUrl"><img :src="detail.mediaUrl" alt=""></template>
                  <div class="wa-text" x-html="waFormat(detailSample)"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </template>

    <!-- ─────────── RELATÓRIOS ─────────── -->
    <template x-if="route.name === 'relatorios'">
      <section class="stack">
        <div class="card card-pad row-wrap" style="gap:12px">
          <template x-if="!isRestaurant">
            <select class="select" style="width:auto" aria-label="Restaurante" x-model="reportState.restaurantId" @change="reportState.month = ''; loadReports()">
              <template x-for="r in restaurants" :key="r.id"><option :value="r.id" x-text="r.name" :selected="r.id === reportState.restaurantId"></option></template>
            </select>
          </template>
          <select class="select" style="width:auto" aria-label="Mês" x-model="reportState.month">
            <template x-for="m in reportState.months" :key="m"><option :value="m" x-text="monthLabel(m)" :selected="m === reportState.month"></option></template>
          </select>
          <span class="grow"></span>
          <a class="btn" :href="`/relatorio?${reportQuery}`" target="_blank" rel="noopener">Abrir em tela cheia</a>
          <a class="btn btn-primary" :href="`/api/reports/monthly.pdf?${reportQuery}`">Baixar PDF</a>
        </div>
        <template x-if="reportState.restaurantId && reportState.month">
          <iframe class="report-frame" :src="`/relatorio?${reportQuery}&print=1`" title="Prévia do relatório"></iframe>
        </template>
      </section>
    </template>

    <!-- ─────────── CONEXÃO ─────────── -->
    <template x-if="route.name === 'conexao'">
      <section class="stack">
        <div class="providers">
          <template x-for="p in providers" :key="p.key">
            <button class="provider" :class="{ on: p.active }" @click="!p.active && useProvider(p.key)">
              <div class="row between"><span class="label-up" x-text="{ simulator: 'Demonstração', wppconnect: 'Agora', 'whatsapp-cloud': 'Depois do faturamento' }[p.key]"></span><span class="small" :style="p.active ? 'color:var(--green-3);font-weight:700' : 'color:var(--muted)'" x-text="p.active ? 'Em uso' : 'Usar este'"></span></div>
              <h3 x-text="p.label"></h3>
              <span class="small muted" x-text="p.description"></span>
            </button>
          </template>
        </div>

        <div class="dash-grid" style="margin:0">
          <div class="card card-pad stack">
            <div>
              <span class="status" :class="conn.state" style="font-size:16px" x-text="CONN[conn.state]"></span>
              <div class="small muted" style="margin-top:4px" x-text="conn.me ? [conn.me.name, conn.me.number].filter(Boolean).join(' · ') : (conn.message || 'Nenhum número conectado')"></div>
            </div>
            <template x-if="conn.state === 'error'"><p class="note red" style="margin:0" x-text="conn.message"></p></template>

            <template x-if="conn.state === 'qr' && conn.qr">
              <div class="row" style="align-items:flex-start;gap:24px;flex-wrap:wrap">
                <div class="qr-box"><img :src="conn.qr" alt="QR Code para conectar o WhatsApp"></div>
                <ol class="small" style="max-width:280px;line-height:1.8;padding-left:18px;margin:0">
                  <li>Abra o WhatsApp no celular que vai enviar as campanhas</li>
                  <li>Toque em <b>Mais opções</b> ou <b>Configurações</b></li>
                  <li>Entre em <b>Aparelhos conectados</b> e depois em <b>Conectar aparelho</b></li>
                  <li>Aponte a câmera para este código</li>
                </ol>
              </div>
            </template>
            <template x-if="conn.state === 'starting'"><div class="row small muted"><span class="spin"></span><span x-text="conn.message || 'Conectando…'"></span></div></template>

            <div class="row-wrap">
              <template x-if="['disconnected','error'].includes(conn.state)"><button class="btn btn-primary" @click="connect">Conectar</button></template>
              <template x-if="['connected','qr','starting'].includes(conn.state)"><button class="btn" @click="disconnect(false)">Pausar conexão</button></template>
