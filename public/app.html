              <template x-if="conn.capabilities?.qrLogin && conn.state !== 'disconnected'"><button class="btn btn-danger" @click="disconnect(true)">Desconectar número</button></template>
            </div>

            <div class="divider" style="margin:0"></div>
            <div class="field">
              <label>Enviar mensagem de teste</label>
              <div class="row-wrap">
                <input class="input" style="max-width:220px" x-model="testPhone" placeholder="(31) 99999-9999" inputmode="tel">
                <button class="btn btn-dark" @click="sendConnTest" :disabled="conn.state !== 'connected'">Enviar</button>
              </div>
            </div>

            <template x-if="conn.provider === 'wppconnect'">
              <p class="note small" style="margin:0">Use um número só para campanhas, mantenha os intervalos entre envios e mande apenas para quem autorizou. O WhatsApp Web não é um canal oficial e o número pode ser bloqueado se parecer spam.</p>
            </template>
            <template x-if="conn.provider === 'whatsapp-cloud'">
              <p class="note small" style="margin:0">Webhook na Meta: <code x-text="`${meta.publicUrl}/webhooks/whatsapp`"></code>, com o token de <code>WA_CLOUD_VERIFY_TOKEN</code>.</p>
            </template>

            <div>
              <div class="label-up" style="margin-bottom:6px">Para desenvolvedores</div>
              <div class="code"><span class="c"># .env: canal usado ao iniciar o servidor</span>
<span class="k">MESSAGING_PROVIDER</span>=simulator | wppconnect | whatsapp-cloud

<span class="c">// src/bootstrap.js: a fila só conhece o contrato</span>
dispatch = new DispatchService({ <span class="k">messaging</span>, ... })</div>
            </div>
          </div>

          <div class="card card-pad" style="display:grid;justify-items:center;gap:12px">
            <template x-if="conn.provider === 'simulator'">
              <div style="display:grid;gap:12px;justify-items:center;width:100%">
                <p class="small muted center" style="margin:0;max-width:340px">Mensagens que o simulador “enviou”. Os links funcionam: abra um para fazer um pedido no site de demonstração.</p>
                <div class="phone">
                  <div class="phone-screen">
                    <div class="wa-top"><span class="wa-avatar" style="--c:#73350c">SC</span><div><div class="name">Enviadas pelo simulador</div><div class="sub" x-text="`${outbox.length} mensagens`"></div></div></div>
                    <div class="wa-chat">
                      <template x-for="item in outbox.slice(0, 40)" :key="item.id">
                        <div style="display:flex;flex-direction:column">
                          <div class="outbox-to" x-text="`para ${fmt.phone(item.to)}`"></div>
                          <div class="wa-bubble out">
                            <template x-if="item.mediaUrl"><img :src="item.mediaUrl" alt=""></template>
                            <div class="wa-text" x-html="waFormat(item.text)"></div>
                            <div class="wa-meta"><span x-text="fmt.time(item.at)"></span><span class="ticks" :class="{ read: item.status === 'read' }" x-text="item.status === 'sent' ? '✓' : '✓✓'"></span></div>
                          </div>
                          <button class="tool" style="align-self:flex-end;margin-top:3px;font-size:11px" @click="simulateReply(item)">simular resposta SAIR</button>
                        </div>
                      </template>
                      <template x-if="!outbox.length"><div class="wa-day" style="margin-top:40%">Nenhuma mensagem ainda</div></template>
                    </div>
                  </div>
                </div>
              </div>
            </template>
            <template x-if="conn.provider !== 'simulator'">
              <div class="empty" style="padding:30px 10px">
                <span class="snake" style="width:80px;--logo-color:var(--line-2)"></span>
                <span class="small" style="max-width:300px">As mensagens saem pelo número conectado. Entregas, leituras e cliques aparecem na página de cada campanha.</span>
              </div>
            </template>
          </div>
        </div>
      </section>
    </template>

    <!-- ─────────── CONFIGURAÇÕES ─────────── -->
    <template x-if="route.name === 'configuracoes'">
      <form class="dash-grid" @submit.prevent="saveSettings">
        <div class="card card-pad stack">
          <h3 style="font-size:16px">Ritmo de envio</h3>
          <p class="small muted" style="margin:0">As mensagens saem uma de cada vez, com uma pausa aleatória entre elas. No simulador a pausa é de 1 a 2 segundos.</p>
          <div class="grid-3">
            <div class="field"><label>Pausa mínima (s)</label><input class="input" type="number" min="1" x-model.number="settings.minDelaySeconds"></div>
            <div class="field"><label>Pausa máxima (s)</label><input class="input" type="number" min="1" x-model.number="settings.maxDelaySeconds"></div>
            <div class="field"><label>Máximo por dia</label><input class="input" type="number" min="1" x-model.number="settings.dailyLimit"></div>
          </div>
          <label class="check"><input type="checkbox" x-model="settings.businessHoursOnly"> Enviar só dentro do horário abaixo</label>
          <div class="grid-2" x-show="settings.businessHoursOnly">
            <div class="field"><label>Das</label><input class="input" type="time" x-model="settings.businessHours.start"></div>
            <div class="field"><label>Até</label><input class="input" type="time" x-model="settings.businessHours.end"></div>
          </div>
        </div>
        <div class="card card-pad stack">
          <h3 style="font-size:16px">Descadastro</h3>
          <div class="field"><label>Palavras que tiram o cliente da lista</label><input class="input" :value="Array.isArray(settings.optOutKeywords) ? settings.optOutKeywords.join(', ') : settings.optOutKeywords" @input="settings.optOutKeywords = $event.target.value"><span class="hint">Separadas por vírgula.</span></div>
          <div class="field"><label>Resposta automática</label><textarea class="textarea" style="min-height:76px" x-model="settings.optOutReply"></textarea></div>
          <div class="field"><label>Rodapé das campanhas</label><input class="input" x-model="settings.footer"></div>
          <div class="row" style="justify-content:flex-end"><button class="btn btn-dark">Salvar</button></div>
        </div>
      </form>
    </template>
  </main>
</div>
</template>

<!-- ═════════════ MODAIS ═════════════ -->
<template x-if="restaurantModal">
  <div class="overlay" @keydown.escape.window="restaurantModal=null" @click.self="restaurantModal=null">
    <div class="modal modal-lg" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div><div class="label-up">Diagnóstico</div><h2 x-text="restaurantModal.id ? restaurantModal.name : 'Novo restaurante'"></h2></div>
        <button class="btn btn-ghost btn-icon" @click="restaurantModal=null" aria-label="Fechar" x-html="icon('x')"></button>
      </div>
      <div class="modal-body">
        <div class="tabs">
          <button :class="{ on: restaurantTab==='diagnostico' }" @click="restaurantTab='diagnostico'">Dados</button>
          <button :class="{ on: restaurantTab==='estrategia' }" @click="restaurantTab='estrategia'">Público e objetivos</button>
          <button :class="{ on: restaurantTab==='cardapio' }" @click="restaurantTab='cardapio'" x-text="`Cardápio (${restaurantModal.menu.length})`"></button>
          <button :class="{ on: restaurantTab==='indicacao' }" @click="restaurantTab='indicacao'">Indicação</button>
          <button :class="{ on: restaurantTab==='acesso' }" @click="restaurantTab='acesso'" x-show="restaurantModal.id">Acesso do restaurante</button>
        </div>
        <div x-show="restaurantTab==='diagnostico'" class="stack">
          <div class="grid-2">
            <div class="field"><label>Nome</label><input class="input" x-model="restaurantModal.name" required></div>
            <div class="field"><label>Tipo de cozinha</label><input class="input" x-model="restaurantModal.segment"></div>
            <div class="field"><label>Cidade</label><input class="input" x-model="restaurantModal.city"></div>
            <div class="field"><label>Site de pedidos</label><input class="input" type="url" x-model="restaurantModal.siteUrl" placeholder="Em branco: site de demonstração"></div>
            <div class="field"><label>Telefone</label><input class="input" x-model="restaurantModal.phone"></div>
            <div class="field"><label>Instagram</label><input class="input" x-model="restaurantModal.instagram"></div>
            <div class="field"><label>Endereço</label><input class="input" x-model="restaurantModal.address"></div>
            <div class="field"><label>Horário</label><input class="input" x-model="restaurantModal.hours"></div>
            <div class="field" style="grid-column:1/-1"><label>Frase do site</label><input class="input" x-model="restaurantModal.tagline"></div>
            <div class="field"><label>Cor</label><input class="input" type="color" style="padding:3px;height:40px" x-model="restaurantModal.color"></div>
            <div class="field"><label>Cupom padrão</label><input class="input" x-model="restaurantModal.coupon" style="text-transform:uppercase"></div>
          </div>
          <div class="field">
            <label>Fotos do topo do site</label>
            <div class="gallery" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
              <template x-for="(b, i) in (restaurantModal.banners || [])" :key="b">
                <div style="position:relative"><img :src="b" alt="" style="width:100%;aspect-ratio:1200/520;object-fit:cover;border-radius:4px"><button type="button" class="btn btn-sm" style="position:absolute;top:4px;right:4px;min-height:26px;padding:0 8px" @click="restaurantModal.banners.splice(i, 1)">Remover</button></div>
              </template>
              <label class="menu-photo" style="width:100%;height:auto;aspect-ratio:1200/520">
                <span class="small">+ Adicionar foto</span>
                <input type="file" accept="image/jpeg,image/png,image/webp" class="sr-only" @change="uploadBanner($event.target.files[0]); $event.target.value=''">
              </label>
            </div>
            <span class="hint">Aparecem em carrossel no topo do site de pedidos. Use fotos na horizontal.</span>
          </div>
        </div>
        <div x-show="restaurantTab==='estrategia'" class="stack">
          <div class="field"><label>Público</label><textarea class="textarea" style="min-height:76px" x-model="restaurantModal.audience" placeholder="Quem compra, de onde, em que dias e horários"></textarea></div>
          <div class="field"><label>Produtos principais</label><textarea class="textarea" style="min-height:66px" x-model="restaurantModal.products"></textarea></div>
          <div class="field"><label>Objetivos</label><textarea class="textarea" style="min-height:66px" x-model="restaurantModal.goals"></textarea></div>
          <div class="field"><label>Jeito de falar</label><input class="input" x-model="restaurantModal.tone"></div>
        </div>
        <div x-show="restaurantTab==='indicacao'" class="stack">
          <label class="check"><input type="checkbox" x-model="restaurantModal.referral.enabled"> Programa de indicação ligado</label>
          <p class="small muted" style="margin:0">O cliente cria o próprio link em <b x-text="restaurantModal.slug ? `/indicar/${restaurantModal.slug}` : '/indicar/<restaurante>'"></b>. O amigo ganha o desconto no primeiro pedido; quando esse pedido é concluído, quem indicou recebe um cupom de uso único pelo WhatsApp. Os descontos não acumulam: vale o maior.</p>
          <fieldset class="ref-box">
            <legend>Desconto do indicado</legend>
            <div class="grid-3">
              <div class="field"><label>Tipo</label><select class="select" x-model="restaurantModal.referral.discountType"><option value="fixed">R$</option><option value="percent">%</option></select></div>
              <div class="field"><label>Valor</label><input class="input" inputmode="decimal" x-model="restaurantModal.referral.discountValue" placeholder="10"></div>
              <div class="field"><label>Pedido mínimo (R$)</label><input class="input" inputmode="decimal" x-model="restaurantModal.referral.minOrder" placeholder="0"></div>
            </div>
            <div class="field" style="max-width:240px"><label>Programa vale até</label><input class="input" type="date" x-model="restaurantModal.referral.validUntil"><span class="hint">Em branco: sem data para acabar.</span></div>
          </fieldset>
          <fieldset class="ref-box">
            <legend>Cupom de quem indicou</legend>
            <div class="grid-2">
              <div class="field"><label>Tipo</label><select class="select" x-model="restaurantModal.referral.rewardType"><option value="fixed">R$</option><option value="percent">%</option></select></div>
              <div class="field"><label>Valor</label><input class="input" inputmode="decimal" x-model="restaurantModal.referral.rewardValue" placeholder="15"></div>
            </div>
            <div class="grid-2">
              <div class="field"><label>Pedido mínimo (R$)</label><input class="input" inputmode="decimal" x-model="restaurantModal.referral.rewardMinOrder" placeholder="0"></div>
              <div class="field"><label>Validade (dias)</label><input class="input" inputmode="numeric" x-model="restaurantModal.referral.rewardValidDays"></div>
            </div>
          </fieldset>
          <div class="field"><label>Convite padrão</label><textarea class="textarea" x-model="restaurantModal.referral.inviteMessage" placeholder="Oi! Eu peço no {{restaurante}} e recomendo. Pelo meu link você ganha {{desconto}} no primeiro pedido pelo site: {{link}}"></textarea><span class="hint">Quando o cliente não escreve a própria mensagem. Variáveis: {{restaurante}}, {{desconto}}, {{link}}.</span></div>
          <div class="field"><label>Mensagem do cupom</label><textarea class="textarea" x-model="restaurantModal.referral.rewardMessage" placeholder="Oi, {{primeiro_nome}}! {{indicado}} fez o primeiro pedido no {{restaurante}} pelo seu convite. Seu presente é o cupom *{{cupom}}*, de {{desconto}}{{minimo}}, válido até {{validade}}. Use no site: {{link}}"></textarea><span class="hint">Variáveis: {{primeiro_nome}}, {{indicado}}, {{restaurante}}, {{cupom}}, {{desconto}}, {{minimo}}, {{validade}}, {{link}}.</span></div>
        </div>
        <div x-show="restaurantTab==='acesso'" class="stack">
          <label class="check"><input type="checkbox" :checked="restaurantModal.requireApproval !== false" @change="restaurantModal.requireApproval = $event.target.checked"> Campanhas só são enviadas depois de aprovadas pelo restaurante</label>
          <p class="small muted" style="margin:0">Quem tem acesso entra em <b x-text="`${meta.publicUrl}/app`"></b>, aprova as campanhas e vê os relatórios só deste restaurante. Não vê contatos, outros restaurantes nem configurações. O gerente também convida a própria equipe.</p>
          <div class="card card-pad stack" style="gap:8px">
            <template x-if="!restaurantAccess.length"><span class="small muted">Ninguém do restaurante tem acesso ainda.</span></template>
            <template x-for="u in restaurantAccess" :key="u.id">
              <div class="row" style="justify-content:space-between"><span><span x-text="u.name"></span> <span class="small muted" x-text="`· ${ROLE[u.role] || u.role}`"></span></span><span class="status" :class="accessStatus(u).cls" x-text="accessStatus(u).label"></span></div>
            </template>
          </div>
          <button class="btn btn-sm" style="justify-self:start" @click="manageAccess(restaurantModal)">Gerenciar acessos</button>
        </div>
        <div x-show="restaurantTab==='cardapio'" class="stack">
          <template x-for="(m, i) in restaurantModal.menu" :key="m.id">
            <div class="menu-edit">
              <label class="menu-photo" :title="m.image ? 'Trocar foto' : 'Adicionar foto'">
                <template x-if="m.image"><img :src="m.image" alt=""></template>
                <template x-if="!m.image"><span x-html="icon('image',20)"></span></template>
                <input type="file" accept="image/jpeg,image/png,image/webp" class="sr-only" @change="uploadMenuImage(m, $event.target.files[0]); $event.target.value=''">
              </label>
              <input class="input" x-model="m.category" placeholder="Categoria">
              <div style="display:grid;gap:6px"><input class="input" x-model="m.name" placeholder="Item"><input class="input" x-model="m.description" placeholder="Descrição"></div>
              <input class="input" x-model="m.price" placeholder="Preço" inputmode="decimal">
              <button class="btn btn-ghost btn-icon" @click="restaurantModal.menu.splice(i,1)" x-html="icon('trash',15)" aria-label="Remover item"></button>
            </div>
          </template>
          <button class="btn btn-sm" style="justify-self:start" @click="addMenuItem">Adicionar item</button>
        </div>
      </div>
      <div class="modal-foot" style="justify-content:space-between">
        <div><template x-if="restaurantModal.id"><button class="btn btn-danger btn-sm" @click="deleteRestaurant(restaurantModal)">Excluir</button></template></div>
        <div class="row"><button class="btn btn-ghost" @click="restaurantModal=null">Cancelar</button><button class="btn btn-dark" @click="saveRestaurant">Salvar</button></div>
      </div>
    </div>
  </div>
</template>

<template x-if="contactModal">
  <div class="overlay" @keydown.escape.window="contactModal=null" @click.self="contactModal=null">
    <form class="modal" role="dialog" aria-modal="true" @submit.prevent="saveContact">
      <div class="modal-head"><h2 x-text="contactModal.id ? 'Editar contato' : 'Novo contato'"></h2><button type="button" class="btn btn-ghost btn-icon" @click="contactModal=null" x-html="icon('x')" aria-label="Fechar"></button></div>
      <div class="modal-body">
        <template x-if="!contactModal.id">
          <div class="field"><label>Restaurante</label><select class="select" x-model="contactModal.restaurantId"><template x-for="r in restaurants" :key="r.id"><option :value="r.id" x-text="r.name" :selected="r.id===contactModal.restaurantId"></option></template></select></div>
        </template>
        <div class="grid-2">
          <div class="field"><label>Nome</label><input class="input" x-model="contactModal.name"></div>
          <div class="field"><label>WhatsApp</label><input class="input" required x-model="contactModal.phone" placeholder="(31) 99999-9999" inputmode="tel"></div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>Aniversário</label>
            <div class="bday-fields">
              <select class="select" aria-label="Dia" x-model="contactModal.birthDay"><option value="">Dia</option><template x-for="d in 31" :key="d"><option :value="d" x-text="d" :selected="String(d) === String(contactModal.birthDay)"></option></template></select>
              <select class="select" aria-label="Mês" x-model="contactModal.birthMonth"><option value="">Mês</option><template x-for="(m, i) in MONTH_NAMES" :key="m"><option :value="i + 1" x-text="m" :selected="String(i + 1) === String(contactModal.birthMonth)"></option></template></select>
              <input class="input" aria-label="Ano (opcional)" inputmode="numeric" maxlength="4" placeholder="Ano" x-model="contactModal.birthYear">
            </div>
          </div>
          <div class="field">
            <label>Bairro</label>
            <input class="input" x-model="contactModal.neighborhood" maxlength="80" :placeholder="contactModal.purchase?.lastNeighborhood ? `Do último pedido: ${contactModal.purchase.lastNeighborhood}` : ''">
            <span class="hint">Vazio: vale o bairro do último pedido.</span>
          </div>
        </div>
        <div class="field"><label>Tags</label><input class="input" x-model="contactModal.tagsText" placeholder="vip, almoco"><span class="hint">Separadas por vírgula.</span></div>
        <div class="field"><label>Como autorizou</label><input class="input" x-model="contactModal.optInSource" placeholder="Ex.: cadastro no balcão"></div>
        <label class="check"><input type="checkbox" x-model="contactModal.optIn"> O cliente autorizou receber mensagens</label>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" @click="contactModal=null">Cancelar</button><button class="btn btn-dark">Salvar</button></div>
    </form>
  </div>
</template>

<template x-if="importModal">
  <div class="overlay" @keydown.escape.window="importModal=null" @click.self="importModal=null">
    <div class="modal modal-lg" role="dialog" aria-modal="true">
      <div class="modal-head"><h2>Importar contatos</h2><button class="btn btn-ghost btn-icon" @click="importModal=null" x-html="icon('x')" aria-label="Fechar"></button></div>
      <template x-if="!importModal.result">
        <div class="modal-body">
          <div class="grid-2">
            <div class="field"><label>Restaurante</label><select class="select" x-model="importModal.restaurantId"><template x-for="r in restaurants" :key="r.id"><option :value="r.id" x-text="r.name" :selected="r.id===importModal.restaurantId"></option></template></select></div>
            <div class="field"><label>Arquivo CSV</label><input class="input" type="file" accept=".csv,.txt" @change="readImportFile"></div>
          </div>
          <div class="field">
            <label>Ou cole a lista</label>
            <textarea class="textarea mono" x-model="importModal.text" placeholder="nome;telefone;tags&#10;Marina Souza;31999990000;vip|almoco"></textarea>
            <span class="hint">Colunas: nome, telefone e tags (opcional). Separadas por ponto e vírgula, vírgula ou tab.</span>
          </div>
          <div class="grid-2">
            <div class="field"><label>Tag para todos</label><input class="input" x-model="importModal.tags" placeholder="ex.: lista-balcao"></div>
            <div class="field"><label>Como autorizaram</label><input class="input" x-model="importModal.source"></div>
          </div>
          <template x-if="importRows.length">
            <div class="card">
              <div class="card-head"><b x-text="`${importRows.length} contatos na lista`"></b><span class="small muted">primeiras linhas</span></div>
              <table class="table"><tbody><template x-for="r in importRows.slice(0,5)"><tr><td x-text="r.name || '—'"></td><td class="num" x-text="r.phone"></td><td x-text="r.tags.join(', ')"></td></tr></template></tbody></table>
            </div>
          </template>
          <label class="check"><input type="checkbox" x-model="importModal.consent"><span class="small">Confirmo que esses clientes autorizaram receber mensagens do restaurante (LGPD).</span></label>
        </div>
      </template>
      <template x-if="importModal.result">
        <div class="modal-body">
          <p style="margin:0"><b x-text="importModal.result.created"></b> contatos novos, <span x-text="importModal.result.updated"></span> atualizados e <span x-text="importModal.result.invalid.length"></span> ignorados.</p>
          <template x-if="importModal.result.invalid.length">
            <ul class="small" style="margin:0;color:var(--danger)"><template x-for="i in importModal.result.invalid.slice(0,8)"><li x-text="`${i.row.name || ''} ${i.row.phone || ''}: ${i.error}`"></li></template></ul>
          </template>
        </div>
      </template>
      <div class="modal-foot">
        <button class="btn btn-ghost" @click="importModal=null" x-text="importModal.result ? 'Fechar' : 'Cancelar'"></button>
        <template x-if="!importModal.result"><button class="btn btn-dark" :disabled="!importRows.length || !importModal.consent || importModal.loading" @click="runImport"><span class="spin" x-show="importModal.loading"></span> Importar</button></template>
      </div>
    </div>
  </div>
</template>

<template x-if="filterModal">
  <div class="overlay" @keydown.escape.window="filterModal=null" @click.self="filterModal=null">
    <form class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="fm-title" @submit.prevent="applyFilters" @input.debounce.300ms="refreshFilterCount()" @change="refreshFilterCount()">
      <div class="modal-head">
        <div><h2 id="fm-title">Filtrar por compras</h2><div class="small muted">Todos os filtros valem juntos. Pedidos cancelados não contam.</div></div>
        <button type="button" class="btn btn-ghost btn-icon" @click="filterModal=null" x-html="icon('x')" aria-label="Fechar"></button>
      </div>
      <div class="modal-body filters-form">
        <fieldset>
          <legend>Pedidos e gasto</legend>
          <div class="grid-2">
            <div class="field"><label>Quantidade de pedidos</label><div class="range"><input class="input" inputmode="numeric" placeholder="mín." aria-label="Mínimo de pedidos" x-model="filterModal.form.ordersMin"><span>a</span><input class="input" inputmode="numeric" placeholder="máx." aria-label="Máximo de pedidos" x-model="filterModal.form.ordersMax"></div><span class="hint">Máximo 0: quem nunca comprou.</span></div>
            <div class="field"><label>Total gasto (R$)</label><div class="range"><input class="input" inputmode="decimal" placeholder="mín." aria-label="Gasto mínimo" x-model="filterModal.form.spentMin"><span>a</span><input class="input" inputmode="decimal" placeholder="máx." aria-label="Gasto máximo" x-model="filterModal.form.spentMax"></div></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>Quando comprou</legend>
          <div class="field">
            <label>Dias desde a última compra</label>
            <div class="range"><input class="input" inputmode="numeric" placeholder="no mínimo" aria-label="No mínimo dias" x-model="filterModal.form.lastMin"><span>a</span><input class="input" inputmode="numeric" placeholder="no máximo" aria-label="No máximo dias" x-model="filterModal.form.lastMax"><span>dias</span></div>
            <div class="row-wrap" style="gap:6px;margin-top:6px">
              <button type="button" class="chip chip-toggle" @click="Object.assign(filterModal.form, { lastMin: '30', lastMax: '' }); refreshFilterCount()">Sumidos há 30+ dias</button>
              <button type="button" class="chip chip-toggle" @click="Object.assign(filterModal.form, { lastMin: '60', lastMax: '' }); refreshFilterCount()">Sumidos há 60+ dias</button>
              <button type="button" class="chip chip-toggle" @click="Object.assign(filterModal.form, { lastMin: '', lastMax: '7' }); refreshFilterCount()">Compraram nos últimos 7 dias</button>
            </div>
            <span class="hint">Quem nunca comprou não entra neste filtro.</span>
          </div>
          <div class="grid-2">
            <div class="field"><label>Primeira compra</label><div class="range"><input class="input" type="date" aria-label="Primeira compra a partir de" x-model="filterModal.form.firstFrom"><span>a</span><input class="input" type="date" aria-label="Primeira compra até" x-model="filterModal.form.firstTo"></div></div>
            <div class="field"><label>Última compra</label><div class="range"><input class="input" type="date" aria-label="Última compra a partir de" x-model="filterModal.form.lastFrom"><span>a</span><input class="input" type="date" aria-label="Última compra até" x-model="filterModal.form.lastTo"></div></div>
          </div>
          <div class="field">
            <label>Dia da semana preferido</label>
            <div class="row-wrap" style="gap:6px">
              <template x-for="(d, i) in WEEKDAYS" :key="d"><button type="button" class="chip chip-toggle" :class="{ on: filterModal.form.weekdays.includes(i) }" @click="toggleIn(filterModal.form.weekdays, i)" x-text="d"></button></template>
            </div>
            <span class="hint">O dia em que o cliente mais fez pedidos.</span>
          </div>
        </fieldset>
        <fieldset>
          <legend>Aniversário</legend>
          <div class="row-wrap" style="gap:10px;align-items:center">
            <select class="select" style="width:auto" aria-label="Tipo de filtro de aniversário" x-model="filterModal.form.bdayMode"><option value="">Qualquer data</option><option value="month">No mês de</option><option value="next">Nos próximos</option></select>
            <template x-if="filterModal.form.bdayMode === 'month'"><select class="select" style="width:auto" aria-label="Mês do aniversário" x-model="filterModal.form.bdayMonth"><template x-for="(m, i) in MONTH_NAMES" :key="m"><option :value="i + 1" x-text="m" :selected="String(i + 1) === String(filterModal.form.bdayMonth)"></option></template></select></template>
            <template x-if="filterModal.form.bdayMode === 'next'"><div class="range" style="max-width:180px"><input class="input" inputmode="numeric" aria-label="Próximos dias" x-model="filterModal.form.bdayNext"><span>dias</span></div></template>
          </div>
        </fieldset>
        <fieldset>
          <legend>Onde e o quê</legend>
          <div class="field">
            <label>Bairro</label>
            <div class="row-wrap facet-list" style="gap:6px">
              <template x-for="n in filterModal.facets.neighborhoods" :key="n.name"><button type="button" class="chip chip-toggle" :class="{ on: filterModal.form.neighborhoods.includes(n.name) }" @click="toggleIn(filterModal.form.neighborhoods, n.name)"><span x-text="n.name"></span> <span style="opacity:.6" x-text="n.count"></span></button></template>
              <template x-if="!filterModal.facets.neighborhoods.length"><span class="small muted">Ainda não há bairros nos contatos ou nos pedidos.</span></template>
            </div>
          </div>
          <div class="field">
            <label>Itens</label>
            <div class="seg" style="margin-bottom:6px" x-show="filterModal.form.items.length">
              <button type="button" :class="{ on: filterModal.form.itemsMode === 'top' }" @click="filterModal.form.itemsMode = 'top'; refreshFilterCount()">é o que mais pede</button>
              <button type="button" :class="{ on: filterModal.form.itemsMode === 'any' }" @click="filterModal.form.itemsMode = 'any'; refreshFilterCount()">já pediu</button>
            </div>
            <div class="row-wrap facet-list" style="gap:6px">
              <template x-for="it in filterModal.facets.items" :key="it.name"><button type="button" class="chip chip-toggle" :class="{ on: filterModal.form.items.includes(it.name) }" @click="toggleIn(filterModal.form.items, it.name)"><span x-text="it.name"></span> <span style="opacity:.6" x-text="it.count"></span></button></template>
              <template x-if="!filterModal.facets.items.length"><span class="small muted">Ainda não há pedidos com itens.</span></template>
            </div>
          </div>
        </fieldset>
      </div>
      <div class="modal-foot" style="justify-content:space-between">
        <div class="small" :class="filterModal.error ? 'red' : 'muted'" role="status">
          <span x-show="filterModal.error" x-text="filterModal.error"></span>
          <span x-show="!filterModal.error && filterModal.count !== null" x-html="`<b>${fmt.int(filterModal.count)}</b> ${filterModal.target === 'editor' ? 'contatos vão receber' : 'contatos autorizados passam nestes filtros'}`"></span>
          <span x-show="!filterModal.error && !filterModal.restaurantId">Escolha um restaurante para ver a contagem.</span>
        </div>
        <div class="row-wrap" style="gap:8px">
          <button type="button" class="btn btn-ghost" @click="filterModal.form = filtersToForm({}); refreshFilterCount()">Limpar tudo</button>
          <button class="btn btn-dark" :disabled="!!filterModal.error">Aplicar filtros</button>
        </div>
      </div>
    </form>
  </div>
</template>

<template x-if="orderModal">
  <div class="overlay" @keydown.escape.window="orderModal=null" @click.self="orderModal=null">
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="order-title">
      <div class="modal-head">
        <div><h2 id="order-title" x-text="`Pedido ${orderLabel(orderModal)}`"></h2><div class="small muted" x-text="[orderModal.restaurant, fmt.dateTime(orderModal.createdAt)].filter(Boolean).join(' · ')"></div></div>
        <button class="btn btn-ghost btn-icon" @click="orderModal=null" x-html="icon('x')" aria-label="Fechar"></button>
      </div>
      <div class="modal-body order-detail">
        <div class="row-wrap" style="gap:8px">
          <span class="status" :class="ORDER_CLASS[orderModal.status]" x-text="orderStatusLabel(orderModal)"></span>
          <span class="chip" x-text="ORDER_SOURCE[orderModal.source] + (orderModal.channel ? ` · ${orderModal.channel}` : '')"></span>
          <span class="chip" x-show="orderModal.fulfillment" x-text="orderModal.fulfillment === 'pickup' ? 'Retirada no balcão' : 'Entrega'"></span>
          <span class="chip" x-show="orderModal.orderId && !orderModal.number" x-text="`Nº externo ${orderModal.orderId}`"></span>
        </div>

        <div class="grid-2">
          <dl class="facts">
            <div><dt>Cliente</dt><dd x-text="orderModal.customerName || '—'"></dd></div>
            <div x-show="orderModal.phone"><dt>WhatsApp</dt><dd><a :href="waLink(orderModal.phone)" target="_blank" rel="noopener" x-text="fmt.phone(orderModal.phone)"></a></dd></div>
            <div x-show="orderModal.cpf"><dt>CPF</dt><dd class="num" x-text="String(orderModal.cpf || '').replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4')"></dd></div>
            <div x-show="orderModal.address"><dt>Endereço</dt><dd x-text="addressText(orderModal.address)"></dd></div>
            <div x-show="!orderModal.address && orderModal.neighborhood"><dt>Bairro</dt><dd x-text="orderModal.neighborhood"></dd></div>
            <div x-show="orderModal.notes"><dt>Observações</dt><dd x-text="orderModal.notes"></dd></div>
          </dl>
          <div>
            <table class="table order-lines">
              <tbody>
                <template x-for="(it, i) in orderModal.items" :key="i">
                  <tr><td><span x-text="`${it.qty}× ${it.name}`"></span><div class="tiny muted" x-show="it.note" x-text="`Obs.: ${it.note}`"></div></td><td class="num" style="text-align:right" x-text="it.price === null || it.price === undefined ? '' : fmt.money(it.qty * it.price)"></td></tr>
                </template>
                <tr x-show="orderModal.discount"><td x-text="orderModal.coupon ? `Cupom ${orderModal.coupon}` : 'Desconto'"></td><td class="num" style="text-align:right" x-text="'− ' + fmt.money(orderModal.discount)"></td></tr>
                <tr><td><b>Total</b></td><td class="num" style="text-align:right"><b x-text="fmt.money(orderModal.value)"></b></td></tr>
              </tbody>
            </table>
            <template x-if="!orderModal.items?.length"><p class="small muted">Sem itens detalhados.</p></template>
          </div>
        </div>

        <template x-if="orderModal.statusLog?.length">
          <div>
            <div class="label-up" style="margin-bottom:6px">Histórico</div>
            <ol class="status-log">
              <template x-for="(e, i) in orderModal.statusLog" :key="i">
                <li><span class="status" :class="ORDER_CLASS[e.status]" x-text="e.status === 'dispatched' && orderModal.fulfillment === 'pickup' ? 'Pronto para retirar' : ORDER_STATUS[e.status]"></span><span class="small muted" x-text="[fmt.dateTime(e.at), e.by || (e.status === 'new' ? 'pelo site' : '')].filter(Boolean).join(' · ')"></span></li>
              </template>
            </ol>
          </div>
        </template>

        <template x-if="orderModal.trackingUrl">
          <div class="row-wrap" style="gap:8px">
            <span class="small muted">Acompanhamento do cliente:</span>
            <a class="small" :href="orderModal.trackingUrl" target="_blank" rel="noopener">abrir página <span x-html="icon('external',13)"></span></a>
            <button class="btn btn-ghost btn-sm" @click="copyTracking(orderModal)"><span x-html="icon('copy',14)"></span> Copiar link</button>
          </div>
        </template>
      </div>
      <div class="modal-foot" style="justify-content:space-between">
        <div>
          <template x-if="!['completed','canceled'].includes(orderModal.status)"><button class="btn btn-ghost" style="color:var(--danger)" @click="cancelOrder(orderModal)">Cancelar pedido</button></template>
        </div>
        <div class="row-wrap" style="gap:8px">
          <button class="btn btn-ghost" @click="orderModal=null">Fechar</button>
          <template x-if="nextStatus(orderModal)"><button class="btn btn-dark" @click="advance(orderModal)" x-text="nextLabel(orderModal)"></button></template>
        </div>
      </div>
    </div>
  </div>
</template>

<template x-if="orderImport">
  <div class="overlay" @keydown.escape.window="orderImport=null" @click.self="orderImport=null">
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="oi-title">
      <div class="modal-head"><h2 id="oi-title">Importar pedidos</h2><button class="btn btn-ghost btn-icon" @click="orderImport=null" x-html="icon('x')" aria-label="Fechar"></button></div>

      <template x-if="!orderImport.result">
        <div class="modal-body">
          <div class="grid-3">
            <div class="field"><label>Restaurante</label><select class="select" x-model="orderImport.restaurantId" @change="orderImport.preview = null"><template x-for="r in restaurants" :key="r.id"><option :value="r.id" x-text="r.name" :selected="r.id===orderImport.restaurantId"></option></template></select></div>
            <div class="field"><label>De onde vem</label><select class="select" x-model="orderImport.channel"><option>iFood</option><option>Caixa</option><option>Outro</option></select></div>
            <div class="field"><label>Arquivo CSV</label><input class="input" type="file" accept=".csv,.txt" @change="readOrderImportFile"></div>
          </div>
          <div class="field">
            <label>Ou cole a planilha</label>
            <textarea class="textarea mono" x-model="orderImport.text" @input="orderImport.preview = null" placeholder="pedido;data;cliente;telefone;total;bairro;itens&#10;9001;05/03/2026 19:40;Marina Souza;31999990000;45,90;Savassi;2x Lasanha"></textarea>
            <span class="hint">Colunas reconhecidas pelo cabeçalho: número do pedido, data, cliente, telefone, total, desconto, bairro e itens. Número, data e total são obrigatórios. Pedido com o mesmo número não entra duas vezes.</span>
          </div>
          <template x-if="orderImportParsed.rows.length && !orderImport.preview">
            <p class="small muted" style="margin:0" x-text="`${orderImportParsed.rows.length} ${orderImportParsed.rows.length === 1 ? 'linha' : 'linhas'} · colunas reconhecidas: ${orderImportParsed.columns.map((c) => ORDER_COLUMN_LABELS[c]).join(', ')}`"></p>
          </template>

          <template x-if="orderImport.preview">
            <div class="card card-pad stack" style="gap:10px">
              <div class="import-nums">
                <div><b x-text="fmt.int(orderImport.preview.toImport)"></b><span>pedidos entram</span></div>
                <div><b x-text="fmt.money(orderImport.preview.revenue)"></b><span>em vendas</span></div>
                <div><b x-text="fmt.int(orderImport.preview.duplicated)"></b><span>já existiam</span></div>
                <div><b x-text="fmt.int(orderImport.preview.newContacts)"></b><span>contatos novos</span></div>
                <div :class="{ bad: orderImport.preview.errorCount }"><b x-text="fmt.int(orderImport.preview.errorCount)"></b><span>com erro</span></div>
              </div>
              <template x-if="orderImport.preview.errors.length">
                <ul class="small" style="margin:0;color:var(--danger);max-height:140px;overflow:auto">
                  <template x-for="e in orderImport.preview.errors" :key="e.line"><li x-text="`Linha ${e.line}${e.orderId ? ` (pedido ${e.orderId})` : ''}: ${e.error}`"></li></template>
                </ul>
              </template>
              <template x-if="orderImport.preview.sample.length">
                <table class="table"><tbody><template x-for="s in orderImport.preview.sample" :key="s.orderId"><tr><td class="num" x-text="s.orderId"></td><td x-text="fmt.dateTime(s.createdAt)"></td><td x-text="s.customerName || '—'"></td><td class="num" style="text-align:right" x-text="fmt.money(s.value)"></td></tr></template></tbody></table>
              </template>
              <label class="check" x-show="orderImport.preview.newContacts"><input type="checkbox" x-model="orderImport.consent"><span class="small">Confirmo que esses clientes autorizaram receber mensagens do restaurante (LGPD). Sem a confirmação, os contatos novos entram sem autorização.</span></label>
            </div>
          </template>
        </div>
      </template>

      <template x-if="orderImport.result">
        <div class="modal-body">
          <p style="margin:0"><b x-text="fmt.int(orderImport.result.imported)"></b> pedidos importados, <span x-text="fmt.int(orderImport.result.duplicated)"></span> já existiam e <span x-text="fmt.int(orderImport.result.errorCount)"></span> com erro.</p>
          <p class="small muted" style="margin:0" x-show="orderImport.result.contactsCreated" x-text="`${fmt.int(orderImport.result.contactsCreated)} contatos novos ${orderImport.consent ? 'autorizados' : 'sem autorização'}.`"></p>
        </div>
      </template>

      <div class="modal-foot">
        <button class="btn btn-ghost" @click="orderImport=null" x-text="orderImport.result ? 'Fechar' : 'Cancelar'"></button>
        <template x-if="!orderImport.result && !orderImport.preview"><button class="btn btn-dark" :disabled="!orderImportParsed.rows.length || orderImport.loading" @click="previewOrderImport"><span class="spin" x-show="orderImport.loading"></span> Conferir planilha</button></template>
        <template x-if="!orderImport.result && orderImport.preview"><button class="btn btn-dark" :disabled="!orderImport.preview.toImport || orderImport.loading" @click="runOrderImport"><span class="spin" x-show="orderImport.loading"></span> <span x-text="`Importar ${fmt.int(orderImport.preview.toImport)} pedidos`"></span></button></template>
      </div>
    </div>
  </div>
</template>

<template x-if="passwordModal">
  <div class="overlay" @keydown.escape.window="passwordModal=null" @click.self="passwordModal=null">
    <form class="modal" style="width:min(420px,100%)" role="dialog" aria-modal="true" @submit.prevent="changeOwnPassword">
      <div class="modal-head"><h2>Trocar senha</h2></div>
      <div class="modal-body">
        <div class="field"><label>Senha atual</label><input class="input" type="password" autocomplete="current-password" x-model="passwordModal.current" required></div>
        <div class="field"><label>Nova senha</label><input class="input" type="password" autocomplete="new-password" minlength="8" x-model="passwordModal.password" required></div>
        <div class="field"><label>Repita a nova senha</label><input class="input" type="password" autocomplete="new-password" minlength="8" x-model="passwordModal.confirm" required></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" @click="passwordModal=null">Cancelar</button><button class="btn btn-dark">Salvar</button></div>
    </form>
  </div>
</template>

<template x-if="accessModal">
  <div class="overlay" @keydown.escape.window="accessModal=null" @click.self="accessModal=null">
    <form class="modal" role="dialog" aria-modal="true" @submit.prevent="saveAccess">
      <div class="modal-head">
        <h2 x-text="accessModal.mode === 'edit' ? 'Editar acesso' : (isRestaurant ? 'Convidar pessoa' : 'Novo acesso')"></h2>
        <button type="button" class="btn btn-ghost btn-icon" @click="accessModal=null" x-html="icon('x')" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <template x-if="accessModal.mode === 'new' && !isRestaurant">
          <div class="field"><label>Restaurante</label>
            <select class="select" x-model="accessModal.restaurantId" @change="accessModal.role = defaultRole(accessModal.restaurantId)" required>
              <template x-for="r in restaurants" :key="r.id"><option :value="r.id" x-text="r.name" :selected="r.id === accessModal.restaurantId"></option></template>
            </select>
          </div>
        </template>
        <div class="grid-2">
          <div class="field"><label>Nome</label><input class="input" x-model="accessModal.name" required></div>
          <div class="field"><label>E-mail</label><input class="input" type="email" x-model="accessModal.email" :disabled="accessModal.mode === 'edit'" required></div>
        </div>
        <div class="field" role="radiogroup" aria-label="Papel">
          <span class="label">Papel</span>
          <label class="check"><input type="radio" value="manager" x-model="accessModal.role" :disabled="accessModal.self"> <span><b>Gerente</b> · pedidos, campanhas e relatórios, e cuida dos acessos da equipe</span></label>
          <label class="check"><input type="radio" value="staff" x-model="accessModal.role" :disabled="accessModal.self"> <span><b>Equipe</b> · pedidos, campanhas e relatórios</span></label>
          <span class="hint" x-show="accessModal.self">Você não pode mudar o próprio papel.</span>
        </div>
        <template x-if="accessModal.mode === 'new' && !isRestaurant">
          <label class="check"><input type="checkbox" x-model="accessModal.setPassword"> Definir a senha agora, em vez de mandar o link de convite</label>
        </template>
        <template x-if="accessModal.mode === 'new' && accessModal.setPassword">
          <div class="field"><label>Senha inicial</label><input class="input" type="text" minlength="8" autocomplete="off" x-model="accessModal.password" required placeholder="mínimo 8 caracteres"></div>
        </template>
        <template x-if="accessModal.mode === 'edit' && !isRestaurant">
          <div class="field"><label>Nova senha (opcional)</label><input class="input" type="text" minlength="8" autocomplete="off" x-model="accessModal.password" placeholder="Em branco: a senha não muda"><span class="hint">Prefira o link de nova senha: assim só a própria pessoa conhece a senha.</span></div>
        </template>
        <p class="small muted" style="margin:0" x-show="accessModal.mode === 'new' && !accessModal.setPassword">Ao criar, aparece um link para você mandar à pessoa. Com ele, ela cria a própria senha (vale por 3 dias e funciona uma vez só).</p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" @click="accessModal=null">Cancelar</button>
        <button class="btn btn-dark" :disabled="accessModal.busy"><span class="spin" x-show="accessModal.busy"></span> <span x-text="accessModal.mode === 'edit' ? 'Salvar' : (accessModal.setPassword ? 'Criar acesso' : 'Criar e gerar link')"></span></button>
      </div>
    </form>
  </div>
</template>

<template x-if="linkBox">
  <div class="overlay" @keydown.escape.window="linkBox=null" @click.self="linkBox=null">
    <div class="modal" style="width:min(540px,100%)" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 x-text="linkBox.purpose === 'invite' ? 'Link de convite' : 'Link de nova senha'"></h2>
        <button class="btn btn-ghost btn-icon" @click="linkBox=null" x-html="icon('x')" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <p style="margin:0">Mande este link só para <b x-text="linkBox.name"></b> (<span x-text="linkBox.email"></span>). Com ele, a pessoa <span x-text="linkBox.purpose === 'invite' ? 'cria a senha e entra no painel' : 'cria uma senha nova'"></span>.</p>
        <div class="row">
          <input class="input mono" readonly :value="linkBox.url" @focus="$event.target.select()" aria-label="Link">
          <button type="button" class="btn" @click="copyLink" x-html="`${icon('copy',16)} ${linkBox.copied ? 'Copiado' : 'Copiar'}`"></button>
        </div>
        <p class="small muted" style="margin:0" x-text="`Vale até ${fmt.dateTime(linkBox.expiresAt)} e funciona uma vez só. Gerar outro link cancela este.`"></p>
        <p class="note green" style="margin:0" x-show="linkBox.emailed">O link também foi mandado para o e-mail da pessoa.</p>
      </div>
      <div class="modal-foot">
        <a class="btn" :href="linkWhatsApp" target="_blank" rel="noopener">Mandar pelo WhatsApp <span x-html="icon('external',14)"></span></a>
        <button class="btn btn-dark" @click="linkBox=null">Pronto</button>
      </div>
    </div>
  </div>
</template>

<template x-if="confirmBox">
  <div class="overlay" style="z-index:80" @keydown.escape.window="confirmBox=null" @click.self="confirmBox=null">
    <div class="modal" style="width:min(430px,100%)" role="alertdialog" aria-modal="true">
      <div class="modal-head"><h2 style="font-size:19px" x-text="confirmBox.title"></h2></div>
      <div class="modal-body"><p style="margin:0" class="muted" x-text="confirmBox.text"></p></div>
      <div class="modal-foot"><button class="btn btn-ghost" @click="confirmBox=null">Voltar</button><button class="btn btn-dark" :disabled="confirmBox.busy" @click="runConfirm"><span class="spin" x-show="confirmBox.busy"></span><span x-text="confirmBox.cta"></span></button></div>
    </div>
  </div>
</template>

<div class="toasts" aria-live="polite">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="t.kind"><strong x-show="t.title" x-text="t.title"></strong><span x-text="t.text"></span></div>
  </template>
</div>
</body>
</html>
